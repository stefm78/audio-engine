name: Voice Casting Qwen3 Extreme Cast Panic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/audio_engine/voice_lab_qwen3_extreme_cast_panic.py
      - tests/test_voice_lab_qwen3_extreme_cast_panic.py
      - .github/workflows/voice-casting-qwen3-extreme-cast-panic.yml

permissions:
  contents: read
  issues: write

env:
  QWEN_REV: 022e286b98fbec7e1e916cb940cdf532cd9f488e
  MODEL_ID: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
  MODEL_REV: 5ecdb67327fd37bb2e042aab12ff7391903235d3
  ISSUE_NUMBER: "102"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  HF_HUB_DISABLE_TELEMETRY: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run offline gates
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m unittest tests.test_voice_lab_qwen3_extreme_cast_panic -v
      - name: Mark run started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
            --title "Extreme natural casting panic killer running $GITHUB_RUN_ID" \
            --body "Minimal direct VoiceDesign killer in progress. Four clips maximum: neutral + panic for each of two deliberately far natural French female identities. Automatic gate before human listening: neutral >=80, panic >=60. Production Edge unchanged."

  render:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        role: [claire, lucie]
    env:
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
      - name: Install core engine
        run: python -m pip install --disable-pip-version-check -e .
      - name: Checkout pinned Qwen3 source
        run: |
          git clone --filter=blob:none https://github.com/QwenLM/Qwen3-TTS.git qwen3-upstream
          cd qwen3-upstream
          git checkout "$QWEN_REV"
          test "$(git rev-parse HEAD)" = "$QWEN_REV"
      - name: Install isolated CPU inference stack
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          python -m pip install --disable-pip-version-check -e ./qwen3-upstream
          python -m pip check
      - name: Download pinned VoiceDesign model
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          print(snapshot_download(repo_id=os.environ['MODEL_ID'], revision=os.environ['MODEL_REV'], local_dir='qwen3-vd-model'))
          PY
          test -f qwen3-vd-model/model.safetensors
      - name: Render only neutral reference and canonical panic
        run: |
          python - <<'PY'
          import json, os, random, time
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          import torch
          from qwen_tts import Qwen3TTSModel
          from transformers.utils import logging as transformers_logging
          from audio_engine.voice_lab_qwen3_extreme_cast_panic import character_spec, reference_instruction, panic_instruction, REFERENCE_TEXT, PANIC_TEXT

          role = os.environ['ROLE']
          spec = character_spec(role)
          model = Qwen3TTSModel.from_pretrained('qwen3-vd-model', device_map='cpu', dtype=torch.bfloat16, attn_implementation='eager')
          transformers_logging.disable_progress_bar()
          root = Path('render-output'); root.mkdir(parents=True)
          rendered = {}
          for kind, text, instruct in (
              ('reference', REFERENCE_TEXT, reference_instruction(role)),
              ('panic', PANIC_TEXT, panic_instruction(role)),
          ):
              seed = int(spec['seed'])
              random.seed(seed); np.random.seed(seed); torch.manual_seed(seed)
              started = time.monotonic()
              print(f'START {role} {kind}', flush=True)
              wavs, sr = model.generate_voice_design(
                  text=text, instruct=instruct, language='French',
                  non_streaming_mode=True, do_sample=True, max_new_tokens=512,
              )
              out = root / f'{kind}.wav'
              sf.write(out, wavs[0], sr)
              elapsed = round(time.monotonic() - started, 2)
              print(f'SUCCESS {role} {kind} {elapsed}s', flush=True)
              rendered[kind] = out.name
          (root / 'character-result.json').write_text(json.dumps({
              'schema':'qwen3-extreme-cast-character-v1','status':'success','role':role,
              'seed':int(spec['seed']),'rendered':rendered,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qwen3-extreme-cast-${{ matrix.role }}
          path: render-output/
          if-no-files-found: error
          retention-days: 14

  bundle:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.assemble.outputs.eligible }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install core engine
        run: python -m pip install --disable-pip-version-check -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qwen3-extreme-cast-*
          path: inputs
      - name: Apply automatic gate and assemble only if eligible
        id: assemble
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from audio_engine.voice_lab_qwen3_extreme_cast_panic import assemble_bundle
          result = assemble_bundle('inputs', 'bundle')
          scores = {k:v['score'] for k,v in result['distance_diagnostics_not_identity_proof'].items()}
          print(json.dumps({'status':result['status'],'scores':scores}, ensure_ascii=False, indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write(f"eligible={'true' if result['status']=='human-gate-ready' else 'false'}\n")
          PY
      - name: Upload human gate when eligible
        if: steps.assemble.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: voice-casting-qwen3-extreme-cast-panic
          path: bundle/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic on auto-reject
        if: steps.assemble.outputs.eligible != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-extreme-cast-panic-auto-reject
          path: bundle/manifest.json
          if-no-files-found: error
          retention-days: 14

  finalize:
    if: always()
    needs: [preflight, render, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ELIGIBLE: ${{ needs.bundle.outputs.eligible }}
      BUNDLE_RESULT: ${{ needs.bundle.result }}
    steps:
      - name: Update experiment issue
        run: |
          if [ "$BUNDLE_RESULT" != "success" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
              --title "Extreme natural casting panic killer failed technically $GITHUB_RUN_ID" \
              --body "Technical failure only; no artistic verdict. Production Edge unchanged."
          elif [ "$ELIGIBLE" = "true" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
              --title "Extreme natural casting panic human gate ready $GITHUB_RUN_ID" \
              --body "Automatic neutral+panic separation gate PASS. Artifact: voice-casting-qwen3-extreme-cast-panic. One blind radio-only screen is ready. Human PASS requires correct identity, acting yes for A+B, French both-good. Production Edge unchanged."
          else
            gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
              --title "Extreme natural casting panic auto-rejected $GITHUB_RUN_ID" \
              --body "The deliberately far natural pair failed the predeclared acoustic gate before human listening. No broader emotion run. Production Edge unchanged."
          fi
