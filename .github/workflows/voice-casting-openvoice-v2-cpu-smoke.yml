name: Voice Casting OpenVoice V2 CPU One-Cell Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/voice-casting-openvoice-v2-cpu-smoke.yml
      - docs/lab/RESOURCE_ADMISSIBILITY.md

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "32823632721"
  SOURCE_ARTIFACT: voice-casting-qwen3-contrast-emotion-killer-recovery
  OPENVOICE_REV: 74a1d147b17a8c3092dd5430504bd83ef6c7eb23
  OPENVOICE_MODEL_REPO: myshell-ai/OpenVoiceV2
  OPENVOICE_MODEL_REV: fd981100305a0e4291f93a9ad169c6d9f7bed54a
  OPENVOICE_MODEL_SHA256: 9652c27e92b6b2a91632590ac9962ef7ae2b712e5c5b7f4c34ec55ee2b37ab9e
  WESPEAKER_REV: dfa741957e5c11f477623b6e583d67d0af25ee88
  WESPEAKER_MODEL_REPO: Wespeaker/wespeaker-voxceleb-resnet34
  WESPEAKER_MODEL_REV: ff1ac5bca8ef11e90662b879aa923979e0bd277b
  WHISPER_REV: 5f86d1d86363843179951550570367b37c5d6f78
  WHISPER_MODEL: small
  WHISPER_MODEL_SHA256: 9ecf779972d90ba49c06d968637d720dd632c55bbf19d441fb42bf17a411e794
  SUPERB_REPO: superb/wav2vec2-base-superb-er
  SUPERB_REV: 54057c4c97e3d100390e1f3c30c3298b552109bd
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  PIP_NO_CACHE_DIR: "1"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Freeze Steve Linus one-cell protocol before model access
        run: |
          python - <<'PY'
          contract = {
              'cell': 'panic--lucie',
              'source': 'immutable Claire panic',
              'target': 'immutable neutral Lucie reference',
              'openvoice_tau': 0.3,
              'torch_seed': 0,
              'reference_extraction': 'whole WAV, direct converter.extract_se, no VAD',
              'watermark': False,
              'new_tts': False,
              'training': False,
              'retry': False,
              'substitution': False,
              'tuning': False,
              'gate_order': ['technical', 'independent WeSpeaker identity', 'Whisper French no-worse-than-source', 'source-relative SUPERB emotion'],
          }
          assert contract['openvoice_tau'] == 0.3
          assert contract['torch_seed'] == 0
          print(contract)
          print('Steve: identity first; one wrong speaker verdict retires the direct-converter path.')
          print('Linus: CPU-only decisive smoke, immutable inputs, default tau, fixed seed, no retries or tuning.')
          PY

      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true

      - name: Recover and verify exact immutable source and references
        run: |
          mkdir -p source evidence/clips weights/openvoice
          gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" -n "$SOURCE_ARTIFACT" -D source
          cat > source-hashes.txt <<'EOF'
          3366f993d108f42525627f1be03e71fdec312b559e067616d2019b69da35cafe  source/reference-claire.wav
          9e5ff59c1b2993b249851bfd3a9f8e78047fd5afd93b034392df1977ae54c822  source/reference-lucie.wav
          ac92fd1f8346b981ac7518e1e698cf8b1c31a96dff069ad60a2d017a17ff9d7f  source/clips/claire--panic.wav
          d2091868592c3c8691c2c0c6a39adaa3613d4941d087c36e4be69e5395a19c84  source/clips/claire--sadness-contained.wav
          EOF
          sha256sum -c source-hashes.txt

      - name: Install pinned minimal OpenVoice CPU runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.2.2 torchaudio==2.2.2
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 librosa==0.10.2.post1 soundfile==0.12.1 scipy==1.14.1 \
            huggingface_hub==0.36.0 eng_to_ipa==0.0.2 inflect==7.0.0 \
            unidecode==1.3.7 pypinyin==0.50.0 cn2an==0.5.22 jieba==0.42.1
          git init OpenVoice
          git -C OpenVoice remote add origin https://github.com/myshell-ai/OpenVoice.git
          git -C OpenVoice fetch --depth=1 origin "$OPENVOICE_REV"
          git -C OpenVoice checkout --detach FETCH_HEAD
          test "$(git -C OpenVoice rev-parse HEAD)" = "$OPENVOICE_REV"
          grep -qi "MIT License" OpenVoice/LICENSE
          python -m pip install --disable-pip-version-check -e OpenVoice --no-deps
          python -m pip check || true

      - name: Download and verify exact OpenVoice V2 converter
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          root=Path('weights/openvoice')
          for name in ['converter/config.json','converter/checkpoint.pth']:
              src=Path(hf_hub_download(repo_id=os.environ['OPENVOICE_MODEL_REPO'], revision=os.environ['OPENVOICE_MODEL_REV'], filename=name))
              dst=root/name; dst.parent.mkdir(parents=True, exist_ok=True); shutil.copy2(src,dst)
          p=root/'converter/checkpoint.pth'
          got=(p.stat().st_size, hashlib.sha256(p.read_bytes()).hexdigest())
          expected=(131320490, os.environ['OPENVOICE_MODEL_SHA256'])
          if got != expected: raise SystemExit(f'OpenVoice converter mismatch: {got}')
          cfg=json.loads((root/'converter/config.json').read_text())
          if cfg.get('_version_') != 'v2': raise SystemExit(f"unexpected converter version {cfg.get('_version_')}")
          if cfg['data']['sampling_rate'] != 22050: raise SystemExit(f"unexpected sampling rate {cfg['data']['sampling_rate']}")
          print('OPENVOICE_PROVENANCE_PASS', got, cfg['_version_'], cfg['data']['sampling_rate'])
          PY

      - name: Convert exactly one immutable panic source to Lucie on CPU
        id: render
        run: |
          /usr/bin/time -v python - <<'PY' 2> evidence/time.txt
          import hashlib, json, time
          from pathlib import Path
          import torch
          from openvoice.api import ToneColorConverter
          torch.set_num_threads(2)
          torch.manual_seed(0)
          converter=ToneColorConverter('weights/openvoice/converter/config.json', device='cpu', enable_watermark=False)
          converter.load_ckpt('weights/openvoice/converter/checkpoint.pth')
          source='source/clips/claire--panic.wav'
          target='source/reference-lucie.wav'
          src_se=converter.extract_se([source])
          tgt_se=converter.extract_se([target])
          torch.manual_seed(0)
          started=time.perf_counter()
          out='evidence/clips/panic--lucie.wav'
          converter.convert(audio_src_path=source, src_se=src_se, tgt_se=tgt_se, output_path=out, tau=0.3)
          elapsed=time.perf_counter()-started
          p=Path(out)
          report={
            'status':'rendered', 'architecture':'OpenVoice V2 direct tone-color conversion',
            'openvoice_revision':'74a1d147b17a8c3092dd5430504bd83ef6c7eb23',
            'model_revision':'fd981100305a0e4291f93a9ad169c6d9f7bed54a',
            'tau':0.3, 'seed':0, 'device':'cpu', 'whole_wav_se':True,
            'watermark':False, 'training':False, 'new_tts':False, 'tuning':False,
            'elapsed_seconds':elapsed, 'output_sha256':hashlib.sha256(p.read_bytes()).hexdigest()
          }
          Path('evidence/render.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY

      - name: Technical integrity gate
        id: technical
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np, soundfile as sf
          y,sr=sf.read('evidence/clips/panic--lucie.wav',dtype='float32'); s,ssr=sf.read('source/clips/claire--panic.wav',dtype='float32')
          if y.ndim==2:y=y.mean(axis=1)
          if s.ndim==2:s=s.mean(axis=1)
          duration=len(y)/sr; source_duration=len(s)/ssr; ratio=duration/max(source_duration,1e-9)
          rms=float(np.sqrt(np.mean(np.square(y)))) if len(y) else 0.0
          finite=bool(np.isfinite(y).all())
          ok=sr==22050 and finite and rms>1e-5 and 0.5<=ratio<=1.5
          report={'status':'pass' if ok else 'reject','sr':sr,'duration':duration,'source_duration':source_duration,'duration_ratio':ratio,'rms':rms,'finite':finite,'rule':'22050 Hz, finite, non-silent, duration within 0.5x..1.5x immutable source'}
          Path('evidence/technical.json').write_text(json.dumps(report,indent=2),encoding='utf-8'); print(json.dumps(report,indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f"eligible={'true' if ok else 'false'}\n")
          PY

      - name: Install independent WeSpeaker verifier
        if: steps.technical.outputs.eligible == 'true'
        run: |
          python -m pip install --disable-pip-version-check onnxruntime==1.20.1
          git init WeSpeaker
          git -C WeSpeaker remote add origin https://github.com/wenet-e2e/wespeaker.git
          git -C WeSpeaker fetch --depth=1 origin "$WESPEAKER_REV"
          git -C WeSpeaker checkout --detach FETCH_HEAD
          test "$(git -C WeSpeaker rev-parse HEAD)" = "$WESPEAKER_REV"
          grep -qi "Apache License" WeSpeaker/LICENSE
          mkdir -p weights/wespeaker
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          root=Path(snapshot_download(repo_id=os.environ['WESPEAKER_MODEL_REPO'],revision=os.environ['WESPEAKER_MODEL_REV'],allow_patterns=['voxceleb_resnet34.onnx'],local_dir='weights/wespeaker'))
          p=root/'voxceleb_resnet34.onnx'; got=(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          expected=(26534127,'9fea6516d7ad6bf0a76c7689f5a49b65d330fad6dde96c91bb4435ffbfe056a1')
          if got!=expected:raise SystemExit(f'WeSpeaker model mismatch: {got}')
          print('WESPEAKER_PROVENANCE_PASS',got)
          PY

      - name: Independent Lucie identity gate
        id: identity
        if: steps.technical.outputs.eligible == 'true'
        run: |
          python - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          import numpy as np, onnxruntime as ort
          spec=importlib.util.spec_from_file_location('ws','WeSpeaker/wespeaker/bin/infer_onnx.py'); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          session=ort.InferenceSession('weights/wespeaker/voxceleb_resnet34.onnx',providers=['CPUExecutionProvider'])
          def emb(path):
              feats=mod.compute_fbank(path).unsqueeze(0).numpy(); e=np.asarray(session.run(['embs'],{'feats':feats})[0]).reshape(-1).astype(np.float64); return e/np.linalg.norm(e)
          def sim(a,b):return float(np.dot(a,b))
          out=emb('evidence/clips/panic--lucie.wav'); lucie=emb('source/reference-lucie.wav'); claire=emb('source/reference-claire.wav')
          a,b=sim(out,lucie),sim(out,claire); margin=a-b; ok=margin>0
          report={'status':'pass' if ok else 'reject','sim_lucie':a,'sim_claire':b,'target_margin':margin,'rule':'Lucie similarity > Claire similarity; no absolute threshold','verifier':'WeSpeaker ResNet34 ONNX','human_proof':False}
          Path('evidence/identity.json').write_text(json.dumps(report,indent=2),encoding='utf-8');print(json.dumps(report,indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f"eligible={'true' if ok else 'false'}\n")
          PY

      - name: Install pinned Whisper only after identity PASS
        if: steps.identity.outputs.eligible == 'true'
        run: |
          python -m pip install --disable-pip-version-check "git+https://github.com/openai/whisper.git@$WHISPER_REV" imageio-ffmpeg==0.6.0
          FFMPEG_BIN="$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )"
          mkdir -p "$HOME/.local/bin"; ln -sf "$FFMPEG_BIN" "$HOME/.local/bin/ffmpeg"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: French content no-worse-than immutable source gate
        id: french
        if: steps.identity.outputs.eligible == 'true'
        run: |
          python - <<'PY'
          import hashlib,json,os,re,unicodedata
          from pathlib import Path
          import whisper
          expected="Vite ! Ils arrivent ! Fermez la porte !"; source_wer=0.5
          def norm(t):
              t=unicodedata.normalize('NFKC',t).lower().replace('’',"'"); t=re.sub(r"[^a-zàâäæçéèêëîïôöœùûüÿ0-9']+",' ',t); return ' '.join(t.split())
          def dist(a,b):
              p=list(range(len(b)+1))
              for i,x in enumerate(a,1):
                  c=[i]
                  for j,y in enumerate(b,1):c.append(min(c[-1]+1,p[j]+1,p[j-1]+(x!=y)))
                  p=c
              return p[-1]
          def wer(r,h):
              a,b=norm(r).split(),norm(h).split(); return dist(a,b)/max(1,len(a))
          model=whisper.load_model(os.environ['WHISPER_MODEL'],device='cpu')
          p=Path.home()/'.cache'/'whisper'/f"{os.environ['WHISPER_MODEL']}.pt"; sha=hashlib.sha256(p.read_bytes()).hexdigest()
          if sha!=os.environ['WHISPER_MODEL_SHA256']:raise SystemExit(f'Whisper SHA mismatch {sha}')
          text=str(model.transcribe('evidence/clips/panic--lucie.wav',language='fr',task='transcribe',fp16=False,temperature=0,condition_on_previous_text=False).get('text','')).strip()
          value=wer(expected,text); ok=value<=source_wer+1e-12
          report={'status':'pass' if ok else 'reject','expected':expected,'transcript':text,'wer':value,'immutable_source_wer':source_wer,'source_baseline_provenance':'same exact source SHA + same exact Whisper Small from prior qualified Lab evidence','rule':'output WER <= immutable source WER','model_sha256':sha,'human_proof':False}
          Path('evidence/french.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8');print(json.dumps(report,ensure_ascii=False,indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f"eligible={'true' if ok else 'false'}\n")
          PY

      - name: Install source-valid SUPERB only after French PASS
        if: steps.french.outputs.eligible == 'true'
        run: |
          python -m pip install --disable-pip-version-check transformers==4.40.1
          mkdir -p weights/superb
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          root=Path(snapshot_download(repo_id=os.environ['SUPERB_REPO'],revision=os.environ['SUPERB_REV'],allow_patterns=['config.json','preprocessor_config.json','pytorch_model.bin'],local_dir='weights/superb'))
          p=root/'pytorch_model.bin'; got=(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()); expected=(378361105,'dac0f46128deec048751ce33eb1a9caecb570904d3d6cf732d6ec345cd6c2e1b')
          if got!=expected:raise SystemExit(f'SUPERB weight mismatch: {got}')
          cfg=json.loads((root/'config.json').read_text()); labels={str(k):str(v).lower() for k,v in cfg['id2label'].items()}
          if labels!={'0':'neu','1':'hap','2':'ang','3':'sad'}:raise SystemExit(f'unexpected labels {labels}')
          print('SUPERB_PROVENANCE_PASS',got)
          PY

      - name: Source-relative panic preservation gate
        id: emotion
        if: steps.french.outputs.eligible == 'true'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import numpy as np,soundfile as sf,torch
          from scipy.signal import resample_poly
          from transformers import AutoFeatureExtractor,AutoModelForAudioClassification
          torch.set_num_threads(2);torch.manual_seed(0)
          extractor=AutoFeatureExtractor.from_pretrained('weights/superb',local_files_only=True);model=AutoModelForAudioClassification.from_pretrained('weights/superb',local_files_only=True).eval()
          labels=[str(model.config.id2label[i]).lower() for i in range(model.config.num_labels)]
          def load16(path):
              y,sr=sf.read(path,dtype='float32');y=np.asarray(y,dtype=np.float32)
              if y.ndim==2:y=y.mean(axis=1)
              if sr!=16000:
                  g=int(np.gcd(sr,16000));y=resample_poly(y,16000//g,sr//g).astype(np.float32)
              return y
          x=extractor(load16('evidence/clips/panic--lucie.wav'),sampling_rate=16000,return_tensors='pt',padding=False)
          with torch.inference_mode():raw=torch.softmax(model(**x).logits[0],dim=-1).cpu().numpy().astype(np.float64)
          n=raw/np.linalg.norm(raw)
          panic=np.asarray([0.0415043309,0.6996874809,0.2587981224,0.0000100258],dtype=np.float64);panic/=np.linalg.norm(panic)
          sad=np.asarray([0.0128470538,0.4423151910,0.5446761847,0.0001615520],dtype=np.float64);sad/=np.linalg.norm(sad)
          a,b=float(np.dot(n,panic)),float(np.dot(n,sad));margin=a-b;ok=margin>0
          report={'status':'pass' if ok else 'reject','profile':{labels[i]:float(raw[i]) for i in range(len(labels))},'similarity_to_immutable_panic_source_profile':a,'similarity_to_immutable_sadness_source_profile':b,'relative_margin':margin,'rule':'output profile closer to exact historical panic source profile than exact historical sadness source profile','source_instrument_preflight':'previous exact-checkpoint source-valid PASS; profile cosine 0.8600842882','semantic_label_claim':False,'human_acting_proof':False}
          Path('evidence/emotion.json').write_text(json.dumps(report,indent=2),encoding='utf-8');print(json.dumps(report,indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f"eligible={'true' if ok else 'false'}\n")
          PY

      - name: Record authoritative autonomous verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def read(name):
              p=Path(f'evidence/{name}.json');return json.loads(p.read_text()) if p.is_file() else None
          render,tech,ident,fr,emo=[read(x) for x in ['render','technical','identity','french','emotion']]
          if render is None:status='infrastructure-incomplete';decision='No scientific OpenVoice evidence: render did not complete.'
          elif tech is None or tech.get('status')!='pass':status='openvoice-technical-reject';decision='Technical reject; no retry or tuning.'
          elif ident is None or ident.get('status')!='pass':status='openvoice-identity-reject';decision='Steve veto: Lucie identity failed; retire direct OpenVoice conversion without tau/reference tuning.'
          elif fr is None or fr.get('status')!='pass':status='openvoice-french-reject';decision='Linus/Steve veto: French content regressed; retire direct OpenVoice conversion without tuning.'
          elif emo is None or emo.get('status')!='pass':status='openvoice-emotion-reject';decision='Steve veto: source-relative panic preservation failed; retire direct OpenVoice conversion without tuning.'
          else:status='one-cell-machine-pass';decision='One-cell PASS. Authorize exact no-tuning four-cell expansion before any human gate.'
          final={'status':status,'decision':decision,'architecture':'OpenVoice V2 direct whole-WAV tone-color conversion','cell':'panic--lucie','tau':0.3,'seed':0,'resource_class':'GitHub-hosted CPU','training':False,'new_tts':False,'retry':False,'substitution':False,'tuning':False,'human_gate':False,'production_qualified':False,'pages_published':False}
          Path('evidence/final.json').write_text(json.dumps(final,indent=2),encoding='utf-8');print(json.dumps(final,indent=2))
          PY

      - name: Upload OpenVoice CPU smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvoice-v2-cpu-one-cell-smoke
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Surface scientific reject as workflow failure
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/final.json')
          if not p.is_file():raise SystemExit('missing authoritative final verdict')
          status=json.loads(p.read_text())['status']
          if status!='one-cell-machine-pass':raise SystemExit(f'scientific verdict: {status}')
          print('ONE_CELL_MACHINE_PASS')
          PY
