name: Voice Casting CosyVoice2 EU Claire Panic Zero Render Validation

on:
  push:
    branches:
      - lab/cosyvoice2-eu-claire-panic-validation
    paths:
      - .github/workflows/voice-casting-cosyvoice2-eu-claire-panic-validation.yml

permissions:
  contents: read
  actions: read

env:
  RENDER_RUN_ID: "33098832122"
  RENDER_ARTIFACT: cosyvoice2-eu-claire-panic-one-cell-render
  CANDIDATE_SHA256: 203860c745229ec7f3316bd831b41fdbc65cc487c7b9e5adea3e58f42641dad3
  SOURCE_RUN_ID: "32823632721"
  SOURCE_ARTIFACT: voice-casting-qwen3-contrast-emotion-killer-recovery
  CLAIRE_REF_SHA256: 3366f993d108f42525627f1be03e71fdec312b559e067616d2019b69da35cafe
  LUCIE_REF_SHA256: 9e5ff59c1b2993b249851bfd3a9f8e78047fd5afd93b034392df1977ae54c822
  CLAIRE_PANIC_SHA256: ac92fd1f8346b981ac7518e1e698cf8b1c31a96dff069ad60a2d017a17ff9d7f
  CLAIRE_SADNESS_SHA256: d2091868592c3c8691c2c0c6a39adaa3613d4941d087c36e4be69e5395a19c84
  WESPEAKER_REV: dfa741957e5c11f477623b6e583d67d0af25ee88
  WESPEAKER_MODEL_REPO: Wespeaker/wespeaker-voxceleb-resnet34
  WESPEAKER_MODEL_REV: ff1ac5bca8ef11e90662b879aa923979e0bd277b
  WHISPER_REV: 5f86d1d86363843179951550570367b37c5d6f78
  WHISPER_MODEL_SHA256: 9ecf779972d90ba49c06d968637d720dd632c55bbf19d441fb42bf17a411e794
  SUPERB_REPO: superb/wav2vec2-base-superb-er
  SUPERB_REV: 54057c4c97e3d100390e1f3c30c3298b552109bd
  HUMAN_BLIND_SEED: "2026082710"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Freeze zero-render validation contract
        run: |
          mkdir -p render source evidence human weights
          python - <<'PY'
          import json,os
          from pathlib import Path
          c={
            "schema":"cosyvoice2-eu-claire-panic-zero-render-validation-v1",
            "parent_pr":164,
            "render_run_id":int(os.environ["RENDER_RUN_ID"]),
            "render_artifact":os.environ["RENDER_ARTIFACT"],
            "candidate_sha256":os.environ["CANDIDATE_SHA256"],
            "new_render_count":0,
            "gate_order":["identity","french","emotion"],
            "identity_rule":"independent WeSpeaker sim(candidate, Claire) > sim(candidate, Lucie); no absolute threshold",
            "french_rule":"pinned Whisper Small WER <= 0.5 against Vite ! Ils arrivent ! Fermez la porte ! only",
            "emotion_rule":"pinned SUPERB candidate profile closer to immutable Claire panic than immutable Claire contained sadness",
            "human_rule":"only if technical+identity+French+emotion all PASS",
            "forbidden":["synthesis","rerender","candidate replacement","threshold change","alternate validator","DSP/VC rescue"],
            "production":False
          }
          Path("evidence/contract.json").write_text(json.dumps(c,indent=2))
          print(json.dumps(c,indent=2))
          PY

      - name: Recover immutable candidate and sources
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          gh run download "$RENDER_RUN_ID" --repo "${{ github.repository }}" -n "$RENDER_ARTIFACT" -D render
          gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" -n "$SOURCE_ARTIFACT" -D source
          test "$(sha256sum render/candidate.wav | cut -d' ' -f1)" = "$CANDIDATE_SHA256"
          test "$(sha256sum source/reference-claire.wav | cut -d' ' -f1)" = "$CLAIRE_REF_SHA256"
          test "$(sha256sum source/reference-lucie.wav | cut -d' ' -f1)" = "$LUCIE_REF_SHA256"
          test "$(sha256sum source/clips/claire--panic.wav | cut -d' ' -f1)" = "$CLAIRE_PANIC_SHA256"
          test "$(sha256sum source/clips/claire--sadness-contained.wav | cut -d' ' -f1)" = "$CLAIRE_SADNESS_SHA256"
          cp render/candidate.wav evidence/candidate.wav
          cp render/technical.json evidence/technical.json
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path("evidence/technical.json").read_text())
          if t["status"]!="pass" or abs(t["duration_ratio"]-1.4375)>1e-12: raise SystemExit(t)
          print("IMMUTABLE_RENDER_TECHNICAL_PASS")
          PY

      - name: Install identity validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 curl
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.7.1 torchaudio==2.7.1
          python -m pip install --disable-pip-version-check numpy scipy soundfile onnxruntime==1.20.1 transformers==4.40.1
          git init WeSpeaker
          git -C WeSpeaker remote add origin https://github.com/wenet-e2e/wespeaker.git
          git -C WeSpeaker fetch --depth=1 origin "$WESPEAKER_REV"
          git -C WeSpeaker checkout --detach FETCH_HEAD
          test "$(git -C WeSpeaker rev-parse HEAD)" = "$WESPEAKER_REV"
          mkdir -p weights/wespeaker
          curl --fail --location --retry 6 --retry-all-errors             "https://huggingface.co/$WESPEAKER_MODEL_REPO/resolve/$WESPEAKER_MODEL_REV/voxceleb_resnet34.onnx?download=true"             -o weights/wespeaker/voxceleb_resnet34.onnx
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("weights/wespeaker/voxceleb_resnet34.onnx")
          got=(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          exp=(26534127,"9fea6516d7ad6bf0a76c7689f5a49b65d330fad6dde96c91bb4435ffbfe056a1")
          if got!=exp: raise SystemExit((got,exp))
          PY

      - name: Independent identity gate
        id: identity
        run: |
          python - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          import numpy as np,onnxruntime as ort
          spec=importlib.util.spec_from_file_location("ws","WeSpeaker/wespeaker/bin/infer_onnx.py")
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          sess=ort.InferenceSession("weights/wespeaker/voxceleb_resnet34.onnx",providers=["CPUExecutionProvider"])
          def emb(path):
              feat=m.compute_fbank(path).unsqueeze(0).numpy()
              e=np.asarray(sess.run(["embs"],{"feats":feat})[0]).reshape(-1).astype(np.float64)
              n=np.linalg.norm(e)
              if not np.isfinite(e).all() or n<=0: raise SystemExit(path)
              return e/n
          outv=emb("evidence/candidate.wav")
          claire=emb("source/reference-claire.wav")
          lucie=emb("source/reference-lucie.wav")
          sc=float(outv@claire); sl=float(outv@lucie); margin=sc-sl; ok=margin>0
          out={"status":"pass" if ok else "reject","sim_claire":sc,"sim_lucie":sl,"target_margin":margin}
          Path("evidence/identity.json").write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:f.write(f"pass={'true' if ok else 'false'}\n")
          PY

      - name: Install pinned Whisper after identity PASS
        if: steps.identity.outputs.pass == 'true'
        run: |
          python -m pip install --disable-pip-version-check "git+https://github.com/openai/whisper.git@$WHISPER_REV" imageio-ffmpeg==0.6.0
          F="$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$F" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Frozen French gate
        id: french
        if: steps.identity.outputs.pass == 'true'
        run: |
          python - <<'PY'
          import hashlib,json,os,re,unicodedata
          from pathlib import Path
          import whisper
          expected="Vite ! Ils arrivent ! Fermez la porte !"
          def norm(t):
              return " ".join(re.sub(r"[^a-zàâäæçéèêëîïôöœùûüÿ0-9']+"," ",unicodedata.normalize("NFKC",t).lower().replace("’","'")).split())
          def dist(a,b):
              p=list(range(len(b)+1))
              for i,x in enumerate(a,1):
                  q=[i]
                  for j,y in enumerate(b,1): q.append(min(q[-1]+1,p[j]+1,p[j-1]+(x!=y)))
                  p=q
              return p[-1]
          model=whisper.load_model("small",device="cpu")
          ckpt=Path.home()/".cache/whisper/small.pt"
          sha=hashlib.sha256(ckpt.read_bytes()).hexdigest()
          if sha!=os.environ["WHISPER_MODEL_SHA256"]: raise SystemExit(sha)
          text=str(model.transcribe("evidence/candidate.wav",language="fr",task="transcribe",fp16=False,temperature=0,condition_on_previous_text=False).get("text","")).strip()
          a,b=norm(expected).split(),norm(text).split(); d=dist(a,b); wer=d/max(1,len(a)); ok=wer<=0.5+1e-12
          out={"status":"pass" if ok else "reject","expected":expected,"transcript":text,"edit_distance":d,"wer":wer,"threshold":0.5}
          Path("evidence/french.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)); print(json.dumps(out,ensure_ascii=False,indent=2))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:f.write(f"pass={'true' if ok else 'false'}\n")
          PY

      - name: Download frozen SUPERB after French PASS
        if: steps.french.outputs.pass == 'true'
        run: |
          mkdir -p weights/superb
          BASE="https://huggingface.co/$SUPERB_REPO/resolve/$SUPERB_REV"
          for F in config.json preprocessor_config.json pytorch_model.bin; do
            curl --fail --location --retry 6 --retry-all-errors "$BASE/$F?download=true" -o "weights/superb/$F"
          done
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("weights/superb/pytorch_model.bin"); h=hashlib.sha256()
          with p.open("rb") as f:
              for c in iter(lambda:f.read(8*1024*1024),b""): h.update(c)
          got=(p.stat().st_size,h.hexdigest())
          exp=(378361105,"dac0f46128deec048751ce33eb1a9caecb570904d3d6cf732d6ec345cd6c2e1b")
          if got!=exp: raise SystemExit((got,exp))
          PY

      - name: Source-relative emotion gate
        id: emotion
        if: steps.french.outputs.pass == 'true'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import numpy as np,soundfile as sf,torch
          from scipy.signal import resample_poly
          from transformers import AutoFeatureExtractor,AutoModelForAudioClassification
          torch.set_num_threads(2)
          ex=AutoFeatureExtractor.from_pretrained("weights/superb",local_files_only=True)
          model=AutoModelForAudioClassification.from_pretrained("weights/superb",local_files_only=True).eval()
          def prof(path):
              y,sr=sf.read(path,dtype="float32"); y=np.asarray(y,dtype=np.float32)
              if y.ndim==2:y=y.mean(1)
              if sr!=16000:
                  g=int(np.gcd(sr,16000)); y=resample_poly(y,16000//g,sr//g).astype(np.float32)
              x=ex(y,sampling_rate=16000,return_tensors="pt",padding=False)
              with torch.inference_mode(): v=torch.softmax(model(**x).logits[0],dim=-1).cpu().numpy().astype(np.float64)
              return v
          def unit(v):
              n=np.linalg.norm(v)
              if not np.isfinite(v).all() or n<=0: raise SystemExit("bad profile")
              return v/n
          cand=prof("evidence/candidate.wav"); panic=prof("source/clips/claire--panic.wav"); sad=prof("source/clips/claire--sadness-contained.wav")
          c,p,s=unit(cand),unit(panic),unit(sad)
          sp=float(c@p); ss=float(c@s); margin=sp-ss; ok=margin>0
          out={"status":"pass" if ok else "reject","candidate_profile":[float(x) for x in cand],"panic_profile":[float(x) for x in panic],"sadness_profile":[float(x) for x in sad],"similarity_panic":sp,"similarity_sadness":ss,"target_margin":margin,"semantic_label_claim":False}
          Path("evidence/emotion.json").write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:f.write(f"pass={'true' if ok else 'false'}\n")
          PY

      - name: Build final machine verdict
        if: always()
        run: |
          python - <<'PY'
          import json,os,random,shutil
          from pathlib import Path
          def st(name):
              p=Path("evidence")/f"{name}.json"
              return json.loads(p.read_text())["status"] if p.exists() else "skipped"
          gates={"technical":"pass","identity":st("identity"),"french":st("french"),"emotion":st("emotion")}
          order=["technical","identity","french","emotion"]
          first=next((g for g in order if gates[g]!="pass"),None)
          final="machine-pass" if first is None else (f"{first}-reject" if gates[first]=="reject" else f"{first}-not-run")
          out={"schema":"cosyvoice2-eu-claire-panic-machine-v1","status":final,"gates":gates,"new_render_count":0,"human_gate_authorized":first is None,"production":False}
          Path("evidence/final.json").write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if first is None:
              rng=random.Random(int(os.environ["HUMAN_BLIND_SEED"]))
              refs=["claire","lucie"]; rng.shuffle(refs)
              shutil.copy2(f"source/reference-{refs[0]}.wav","human/reference-1.wav")
              shutil.copy2(f"source/reference-{refs[1]}.wav","human/reference-2.wav")
              shutil.copy2("evidence/candidate.wav","human/candidate-A.wav")
              Path("evidence/human-mapping.json").write_text(json.dumps({"reference-1":refs[0],"reference-2":refs[1],"blind_seed":int(os.environ["HUMAN_BLIND_SEED"])},indent=2))
              Path("human/manifest.json").write_text(json.dumps({"schema":"cosyvoice2-eu-claire-panic-human-v1","candidate":"candidate-A.wav","references":["reference-1.wav","reference-2.wav"]},indent=2))
          PY

      - name: Create blind human page after machine PASS
        if: steps.emotion.outputs.pass == 'true'
        run: |
          cat > human/index.html <<'HTML'
          <!doctype html><html lang="fr"><meta charset="utf-8"><title>CosyVoice2-EU — gate humain</title>
          <body style="font-family:system-ui;max-width:800px;margin:30px auto;padding:16px">
          <h1>Gate humain aveugle — Claire panique</h1>
          <h2>Référence 1</h2><audio controls src="reference-1.wav"></audio>
          <h2>Référence 2</h2><audio controls src="reference-2.wav"></audio>
          <h2>Candidat A</h2><audio controls src="candidate-A.wav"></audio>
          <p>Même personnage :
          <select id="identity"><option></option><option>Référence 1</option><option>Référence 2</option><option>Impossible</option></select></p>
          <p>Panique crédible :
          <select id="acting"><option></option><option value="yes">yes</option><option value="no">no</option></select></p>
          <p>Français :
          <select id="french"><option></option><option value="good">good</option><option value="no">no</option></select></p>
          <button id="go">Exporter JSON</button><script>
          document.getElementById('go').onclick=()=>{const identity=document.getElementById('identity').value,acting=document.getElementById('acting').value,french=document.getElementById('french').value;if(!identity||!acting||!french)return;const o={schema:'cosyvoice2-eu-claire-panic-human-v1',identity,acting,french};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='cosyvoice2-eu-claire-panic-human.json';a.click();};
          </script></body></html>
          HTML

      - name: Upload zero-render machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosyvoice2-eu-claire-panic-machine-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Upload human gate after machine PASS
        if: steps.emotion.outputs.pass == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cosyvoice2-eu-claire-panic-human-gate
          path: human/
          if-no-files-found: error
          retention-days: 14

      - name: Surface verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("evidence/final.json").read_text())["status"]
          if s!="machine-pass": raise SystemExit(f"verdict: {s}")
          print("COSYVOICE2_EU_MACHINE_PASS")
          PY
