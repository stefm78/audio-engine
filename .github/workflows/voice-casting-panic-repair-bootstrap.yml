name: Voice Casting Panic Repair Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/voice-casting-panic-repair-bootstrap.yml

permissions:
  contents: read
  issues: write

jobs:
  panic-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Render corrected French panic treatments
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from audio_engine.providers.edge import EdgeProvider

          voices = [
              "fr-FR-VivienneMultilingualNeural",
              "pt-BR-ThalitaMultilingualNeural",
              "en-AU-WilliamMultilingualNeural",
              "fr-CH-FabriceNeural",
          ]
          text = "Vite ! Ils arrivent ! Fermez la porte !"
          treatments = [
              ("baseline", "+0%", "+0Hz", "+0%"),
              ("urgent", "+18%", "+6Hz", "+4%"),
              ("intense", "+28%", "+12Hz", "+6%"),
              ("strained", "+8%", "+18Hz", "+5%"),
          ]

          out = Path("panic-repair-output")
          clips = out / "clips"
          clips.mkdir(parents=True, exist_ok=True)
          provider = EdgeProvider()
          manifest = {
              "version": 1,
              "kind": "edge-panic-pronunciation-repair",
              "invalidated_previous_text": "Courez ! Ils arrivent ! Fermez la porte, vite !",
              "replacement_text": text,
              "reason": "Evaluator reported systematic English-accent pronunciation on segment-initial 'Courez'.",
              "voices": voices,
              "cases": [],
          }

          for voice in voices:
              case = {"voice": voice, "probe": "panic", "text": text, "treatments": []}
              for name, rate, pitch, volume in treatments:
                  filename = f"{voice}--panic--{name}.mp3"
                  segment = {
                      "text": text,
                      "voice": voice,
                      "language_locale": "fr-FR",
                      "rate": rate,
                      "pitch": pitch,
                      "volume": volume,
                  }
                  provider.synthesize(segment, clips / filename)
                  case["treatments"].append({
                      "id": name,
                      "rate": rate,
                      "pitch": pitch,
                      "volume": volume,
                      "file": f"clips/{filename}",
                  })
              manifest["cases"].append(case)

          (out / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({"status": "success", "case_count": len(manifest["cases"]), "clip_count": sum(len(c["treatments"]) for c in manifest["cases"])}, indent=2))
          PY

      - name: Upload corrected panic evidence
        uses: actions/upload-artifact@v4
        with:
          name: voice-casting-edge-panic-repair
          path: panic-repair-output/
          if-no-files-found: error
          retention-days: 14

      - name: Publish run locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Voice casting corrected panic probe $RUN_ID" \
            --body "Corrected panic-language probe completed after systematic English-accent pronunciation of segment-initial 'Courez'.\n\n- run_id: $RUN_ID\n- run: $RUN_URL\n- artifact: voice-casting-edge-panic-repair\n- replacement text: Vite ! Ils arrivent ! Fermez la porte !\n\nThis issue is a machine locator and may be closed after evidence retrieval."
