name: Voice Casting Seed-VC CPU One-Cell Killer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/voice-casting-seed-vc-cpu-one-cell.yml

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "32823632721"
  SOURCE_ARTIFACT: voice-casting-qwen3-contrast-emotion-killer-recovery
  HISTORICAL_PANIC_SHA256: ac92fd1f8346b981ac7518e1e698cf8b1c31a96dff069ad60a2d017a17ff9d7f
  CLAIRE_REF_SHA256: 3366f993d108f42525627f1be03e71fdec312b559e067616d2019b69da35cafe
  LUCIE_REF_SHA256: 9e5ff59c1b2993b249851bfd3a9f8e78047fd5afd93b034392df1977ae54c822
  SADNESS_SHA256: d2091868592c3c8691c2c0c6a39adaa3613d4941d087c36e4be69e5395a19c84

  SEED_VC_REV: "51383efd921027683c89e5348211d93ff12ac2a8"
  SEED_VC_HF_REV: "7bdd5167c96c7ec71b6f11e38ce5a385b64ff157"
  CAMPPLUS_HF_REV: "0817bacbf3f87a85962e3b7bbe231ff3c606f404"
  WHISPER_SMALL_HF_REV: "bca8d465a5eadfa43c0250794d1e369daf833a21"
  BIGVGAN_HF_REV: "633ff708ed5b74903e86ff1298cf4a98e921c513"

  SEED_VC_MODEL_SHA256: "8ec8841b20bb46df9f7e8e570a6946a4b87b940133c7f0e778487ff33841f720"
  CAMPPLUS_SHA256: "3388cf5fd3493c9ac9c69851d8e7a8badcfb4f3dc631020c4961371646d5ada8"
  INTERNAL_WHISPER_MODEL_SHA256: "1d7734884874f1a1513ed9aa760a4f8e97aaa02fd6d93a3a85d27b2ae9ca596b"
  INTERNAL_WHISPER_PREPROCESSOR_SHA256: "9b5cd03a36fbb8a627c64d98a5b5b126ead95a77720723944487311f0110b666"
  BIGVGAN_GENERATOR_SHA256: "e95ba25972d3de0628d99cd156e9315a9c018899bf739988959ebe3544080ced"

  WESPEAKER_REV: dfa741957e5c11f477623b6e583d67d0af25ee88
  WESPEAKER_MODEL_REPO: Wespeaker/wespeaker-voxceleb-resnet34
  WESPEAKER_MODEL_REV: ff1ac5bca8ef11e90662b879aa923979e0bd277b
  WHISPER_VALIDATOR_REV: 5f86d1d86363843179951550570367b37c5d6f78
  WHISPER_VALIDATOR_MODEL_SHA256: 9ecf779972d90ba49c06d968637d720dd632c55bbf19d441fb42bf17a411e794
  SUPERB_REPO: superb/wav2vec2-base-superb-er
  SUPERB_REV: 54057c4c97e3d100390e1f3c30c3298b552109bd

  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"
  PIP_NO_CACHE_DIR: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  one-cell:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Recover exact immutable scientific source and references
        run: |
          mkdir -p source evidence/clips human
          gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" -n "$SOURCE_ARTIFACT" -D source
          test "$(sha256sum source/clips/claire--panic.wav | cut -d' ' -f1)" = "$HISTORICAL_PANIC_SHA256"
          test "$(sha256sum source/reference-claire.wav | cut -d' ' -f1)" = "$CLAIRE_REF_SHA256"
          test "$(sha256sum source/reference-lucie.wav | cut -d' ' -f1)" = "$LUCIE_REF_SHA256"
          test "$(sha256sum source/clips/claire--sadness-contained.wav | cut -d' ' -f1)" = "$SADNESS_SHA256"

      - name: Free disk and checkout exact Seed-VC upstream
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          git init SeedVC
          git -C SeedVC remote add origin https://github.com/Plachtaa/seed-vc.git
          git -C SeedVC fetch --depth=1 origin "$SEED_VC_REV"
          git -C SeedVC checkout --detach FETCH_HEAD
          test "$(git -C SeedVC rev-parse HEAD)" = "$SEED_VC_REV"
          grep -q "GNU GENERAL PUBLIC LICENSE" SeedVC/LICENSE

      - name: Install resource-qualified CPU runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu \
            torch==2.4.0 torchaudio==2.4.0 torchvision==0.19.0
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 scipy==1.13.1 librosa==0.10.2 huggingface-hub==0.28.1 \
            munch==4.0.0 einops==0.8.0 descript-audio-codec==1.0.0 \
            transformers==4.46.3 soundfile==0.12.1 hydra-core==1.3.2 \
            pyyaml==6.0.2 accelerate==1.2.1
          python -m pip check

      - name: Freeze exact public model assets before first render
        working-directory: SeedVC
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download, snapshot_download

          def sha(p):
              p=Path(p); return hashlib.sha256(p.read_bytes()).hexdigest()
          def set_main(cache_dir, repo, revision):
              p=Path(cache_dir)/("models--"+repo.replace('/','--'))/'refs'/'main'
              p.parent.mkdir(parents=True,exist_ok=True); p.write_text(revision)

          Path('frozen').mkdir(exist_ok=True)
          seed_model=hf_hub_download(repo_id='Plachta/Seed-VC',filename='DiT_seed_v2_uvit_whisper_small_wavenet_bigvgan_pruned.pth',revision=os.environ['SEED_VC_HF_REV'],cache_dir='./checkpoints')
          seed_cfg=hf_hub_download(repo_id='Plachta/Seed-VC',filename='config_dit_mel_seed_uvit_whisper_small_wavenet.yml',revision=os.environ['SEED_VC_HF_REV'],cache_dir='./checkpoints')
          camp=hf_hub_download(repo_id='funasr/campplus',filename='campplus_cn_common.bin',revision=os.environ['CAMPPLUS_HF_REV'],cache_dir='./checkpoints')
          set_main('./checkpoints','funasr/campplus',os.environ['CAMPPLUS_HF_REV'])

          wh_dir=Path(snapshot_download(repo_id='openai/whisper-small',revision=os.environ['WHISPER_SMALL_HF_REV'],cache_dir='./checkpoints/hf_cache',allow_patterns=['*.json','*.txt','pytorch_model.bin']))
          set_main('./checkpoints/hf_cache','openai/whisper-small',os.environ['WHISPER_SMALL_HF_REV'])
          big_dir=Path(snapshot_download(repo_id='nvidia/bigvgan_v2_22khz_80band_256x',revision=os.environ['BIGVGAN_HF_REV'],cache_dir='./checkpoints/hf_cache',allow_patterns=['config.json','bigvgan_generator.pt']))
          set_main('./checkpoints/hf_cache','nvidia/bigvgan_v2_22khz_80band_256x',os.environ['BIGVGAN_HF_REV'])

          checks={
            'seed_model':(Path(seed_model),440312082,os.environ['SEED_VC_MODEL_SHA256']),
            'campplus':(Path(camp),28036335,os.environ['CAMPPLUS_SHA256']),
            'internal_whisper_model':(wh_dir/'pytorch_model.bin',966995080,os.environ['INTERNAL_WHISPER_MODEL_SHA256']),
            'internal_whisper_preprocessor':(wh_dir/'preprocessor_config.json',184990,os.environ['INTERNAL_WHISPER_PREPROCESSOR_SHA256']),
            'bigvgan_generator':(big_dir/'bigvgan_generator.pt',449228171,os.environ['BIGVGAN_GENERATOR_SHA256']),
          }
          manifest={}
          for name,(p,size,expected) in checks.items():
              got=(p.stat().st_size,sha(p))
              if got!=(size,expected): raise SystemExit(f'{name}: {got}')
              manifest[name]={'bytes':got[0],'sha256':got[1]}
          shutil.copy2(seed_model,'frozen/seedvc.pth')
          shutil.copy2(seed_cfg,'frozen/seedvc.yml')
          manifest['seed_config']={'bytes':Path(seed_cfg).stat().st_size,'sha256':sha(seed_cfg)}
          manifest['revisions']={
            'seed_vc':os.environ['SEED_VC_HF_REV'],
            'campplus':os.environ['CAMPPLUS_HF_REV'],
            'whisper_small':os.environ['WHISPER_SMALL_HF_REV'],
            'bigvgan':os.environ['BIGVGAN_HF_REV']}
          manifest['status']='asset-freeze-pass'; manifest['render_count']=0
          Path('../evidence/assets.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY

      - name: Render exactly one frozen Claire-panic self-target cell
        id: render
        working-directory: SeedVC
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          mkdir -p ../evidence/rendered
          /usr/bin/time -v -o ../evidence/render-time.txt python - <<'PY'
          import hashlib, json, os, random, shutil, time
          from argparse import Namespace
          from pathlib import Path
          import numpy as np, torch

          if torch.cuda.is_available(): raise SystemExit('CUDA unexpectedly available; frozen science lane is CPU')
          random.seed(0); np.random.seed(0); torch.manual_seed(0)
          import inference
          if inference.device.type!='cpu': raise SystemExit(inference.device)
          args=Namespace(
              source='../source/clips/claire--panic.wav',
              target='../source/reference-claire.wav',
              output='../evidence/rendered',
              diffusion_steps=30,
              length_adjust=1.0,
              inference_cfg_rate=0.7,
              f0_condition=False,
              auto_f0_adjust=False,
              semi_tone_shift=0,
              checkpoint='frozen/seedvc.pth',
              config='frozen/seedvc.yml',
              fp16=False)
          started=time.perf_counter(); inference.main(args); elapsed=time.perf_counter()-started
          outs=sorted(Path('../evidence/rendered').glob('*.wav'))
          if len(outs)!=1: raise SystemExit(f'exactly one output required, got {outs}')
          p=outs[0]; digest=hashlib.sha256(p.read_bytes()).hexdigest()
          shutil.copy2(p,'../evidence/clips/seed-vc.wav')
          r={'status':'render-pass','architecture':'Seed-VC-v1-zero-shot-self-target-stabilizer','cell':'claire--panic','seed':0,'device':'cpu','source_sha256':os.environ['HISTORICAL_PANIC_SHA256'],'target_reference_sha256':os.environ['CLAIRE_REF_SHA256'],'diffusion_steps':30,'length_adjust':1.0,'inference_cfg_rate':0.7,'f0_condition':False,'auto_f0_adjust':False,'semi_tone_shift':0,'fp16':False,'output_sha256':digest,'render_wall_seconds':elapsed,'render_count':1,'retry_count':0,'replacement_count':0,'training':False,'finetuning':False,'production':False}
          Path('../evidence/render.json').write_text(json.dumps(r,indent=2)); print(json.dumps(r,indent=2))
          PY

      - name: Technical gate
        id: technical
        if: steps.render.outcome == 'success'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import numpy as np,soundfile as sf
          y,sr=sf.read('evidence/clips/seed-vc.wav',dtype='float32'); s,ssr=sf.read('source/clips/claire--panic.wav',dtype='float32')
          if y.ndim==2:y=y.mean(1)
          if s.ndim==2:s=s.mean(1)
          d=len(y)/sr; sd=len(s)/ssr; ratio=d/sd; rms=float(np.sqrt(np.mean(y*y))); finite=bool(np.isfinite(y).all())
          ok=sr==22050 and finite and rms>1e-5 and .5<=ratio<=1.5
          r={'status':'pass' if ok else 'reject','sr':sr,'expected_native_sr':22050,'duration':d,'source_duration':sd,'duration_ratio':ratio,'rms':rms,'finite':finite,'rule':'native 22050 Hz; finite non-silent; duration 0.5x..1.5x immutable source'}
          Path('evidence/technical.json').write_text(json.dumps(r,indent=2)); print(json.dumps(r,indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f"eligible={'true' if ok else 'false'}\n")
          PY

      - name: Install pinned independent WeSpeaker
        if: steps.technical.outputs.eligible == 'true'
        run: |
          python -m pip install --disable-pip-version-check onnxruntime==1.20.1
          git init WeSpeaker
          git -C WeSpeaker remote add origin https://github.com/wenet-e2e/wespeaker.git
          git -C WeSpeaker fetch --depth=1 origin "$WESPEAKER_REV"
          git -C WeSpeaker checkout --detach FETCH_HEAD
          test "$(git -C WeSpeaker rev-parse HEAD)" = "$WESPEAKER_REV"
          mkdir -p weights/wespeaker
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          p=Path(snapshot_download(repo_id=os.environ['WESPEAKER_MODEL_REPO'],revision=os.environ['WESPEAKER_MODEL_REV'],allow_patterns=['voxceleb_resnet34.onnx'],local_dir='weights/wespeaker'))/'voxceleb_resnet34.onnx'
          got=(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          if got!=(26534127,'9fea6516d7ad6bf0a76c7689f5a49b65d330fad6dde96c91bb4435ffbfe056a1'): raise SystemExit(got)
          PY

      - name: Independent Claire identity gate
        id: identity
        if: steps.technical.outputs.eligible == 'true'
        run: |
          python - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          import numpy as np,onnxruntime as ort
          spec=importlib.util.spec_from_file_location('ws','WeSpeaker/wespeaker/bin/infer_onnx.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          sess=ort.InferenceSession('weights/wespeaker/voxceleb_resnet34.onnx',providers=['CPUExecutionProvider'])
          def emb(p):
              f=m.compute_fbank(p).unsqueeze(0).numpy(); e=np.asarray(sess.run(['embs'],{'feats':f})[0]).reshape(-1).astype(np.float64); return e/np.linalg.norm(e)
          o,c,l=emb('evidence/clips/seed-vc.wav'),emb('source/reference-claire.wav'),emb('source/reference-lucie.wav')
          a=float(o@c); b=float(o@l); margin=a-b; ok=margin>0
          r={'status':'pass' if ok else 'reject','sim_claire':a,'sim_lucie':b,'target_margin':margin,'rule':'independent WeSpeaker Claire > Lucie; no absolute threshold'}
          Path('evidence/identity.json').write_text(json.dumps(r,indent=2)); print(json.dumps(r,indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f"eligible={'true' if ok else 'false'}\n")
          PY

      - name: Install pinned Whisper validator only after identity PASS
        if: steps.identity.outputs.eligible == 'true'
        run: |
          python -m pip install --disable-pip-version-check "git+https://github.com/openai/whisper.git@$WHISPER_VALIDATOR_REV" imageio-ffmpeg==0.6.0
          F="$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )"
          mkdir -p "$HOME/.local/bin"; ln -sf "$F" "$HOME/.local/bin/ffmpeg"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: French no-worse-than-immutable-source gate
        id: french
        if: steps.identity.outputs.eligible == 'true'
        run: |
          python - <<'PY'
          import hashlib,json,os,re,unicodedata
          from pathlib import Path
          import whisper
          expected="Vite ! Ils arrivent ! Fermez la porte !"; source_wer=.5
          def norm(t): return ' '.join(re.sub(r"[^a-zàâäæçéèêëîïôöœùûüÿ0-9']+",' ',unicodedata.normalize('NFKC',t).lower().replace('’',"'")).split())
          def dist(a,b):
              p=list(range(len(b)+1))
              for i,x in enumerate(a,1):
                  q=[i]
                  for j,y in enumerate(b,1):q.append(min(q[-1]+1,p[j]+1,p[j-1]+(x!=y)))
                  p=q
              return p[-1]
          def wer(r,h):
              a,b=norm(r).split(),norm(h).split(); return dist(a,b)/max(1,len(a))
          model=whisper.load_model('small',device='cpu')
          p=Path.home()/'.cache/whisper/small.pt'; sha=hashlib.sha256(p.read_bytes()).hexdigest()
          if sha!=os.environ['WHISPER_VALIDATOR_MODEL_SHA256']: raise SystemExit(sha)
          text=str(model.transcribe('evidence/clips/seed-vc.wav',language='fr',task='transcribe',fp16=False,temperature=0,condition_on_previous_text=False).get('text','')).strip()
          value=wer(expected,text); ok=value<=source_wer+1e-12
          r={'status':'pass' if ok else 'reject','expected':expected,'transcript':text,'wer':value,'immutable_source_wer':source_wer,'rule':'Seed-VC WER <= immutable direct-Qwen panic source WER 0.5'}
          Path('evidence/french.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)); print(json.dumps(r,ensure_ascii=False,indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f"eligible={'true' if ok else 'false'}\n")
          PY

      - name: Install pinned SUPERB only after French PASS
        if: steps.french.outputs.eligible == 'true'
        run: |
          python -m pip install --disable-pip-version-check transformers==4.40.1
          mkdir -p weights/superb
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          p=Path(snapshot_download(repo_id=os.environ['SUPERB_REPO'],revision=os.environ['SUPERB_REV'],allow_patterns=['config.json','preprocessor_config.json','pytorch_model.bin'],local_dir='weights/superb'))/'pytorch_model.bin'
          got=(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          if got!=(378361105,'dac0f46128deec048751ce33eb1a9caecb570904d3d6cf732d6ec345cd6c2e1b'): raise SystemExit(got)
          PY

      - name: Source-relative panic preservation gate
        id: emotion
        if: steps.french.outputs.eligible == 'true'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import numpy as np,soundfile as sf,torch
          from scipy.signal import resample_poly
          from transformers import AutoFeatureExtractor,AutoModelForAudioClassification
          torch.set_num_threads(2)
          ex=AutoFeatureExtractor.from_pretrained('weights/superb',local_files_only=True)
          model=AutoModelForAudioClassification.from_pretrained('weights/superb',local_files_only=True).eval()
          labels=[str(model.config.id2label[i]).lower() for i in range(4)]
          y,sr=sf.read('evidence/clips/seed-vc.wav',dtype='float32'); y=np.asarray(y,dtype=np.float32); y=y.mean(1) if y.ndim==2 else y
          if sr!=16000:
              g=int(np.gcd(sr,16000)); y=resample_poly(y,16000//g,sr//g).astype(np.float32)
          x=ex(y,sampling_rate=16000,return_tensors='pt',padding=False)
          with torch.inference_mode(): raw=torch.softmax(model(**x).logits[0],dim=-1).cpu().numpy().astype(np.float64)
          n=raw/np.linalg.norm(raw)
          panic=np.array([.0415043309,.6996874809,.2587981224,.0000100258]); sad=np.array([.0128470538,.4423151910,.5446761847,.0001615520])
          panic/=np.linalg.norm(panic); sad/=np.linalg.norm(sad)
          a=float(n@panic); b=float(n@sad); margin=a-b; ok=margin>0
          r={'status':'pass' if ok else 'reject','profile':{labels[i]:float(raw[i]) for i in range(4)},'similarity_panic':a,'similarity_sadness':b,'relative_margin':margin,'rule':'closer to immutable direct-Qwen panic profile than immutable contained-sadness profile','semantic_label_claim':False}
          Path('evidence/emotion.json').write_text(json.dumps(r,indent=2)); print(json.dumps(r,indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:f.write(f"eligible={'true' if ok else 'false'}\n")
          PY

      - name: Record authoritative one-cell verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def read(n):
              p=Path('evidence')/f'{n}.json'; return json.loads(p.read_text()) if p.exists() else None
          render,t,i,f,e=[read(x) for x in ['render','technical','identity','french','emotion']]
          if render is None: status='pre-render-infrastructure-failure'
          elif t is None: status='validation-infrastructure-failure'
          elif t.get('status')!='pass': status='technical-reject'
          elif i is None: status='validation-infrastructure-failure'
          elif i.get('status')!='pass': status='identity-reject'
          elif f is None: status='validation-infrastructure-failure'
          elif f.get('status')!='pass': status='french-reject'
          elif e is None: status='validation-infrastructure-failure'
          elif e.get('status')!='pass': status='emotion-reject'
          else: status='one-cell-machine-pass'
          out={'status':status,'architecture':'Seed-VC-v1-zero-shot-self-target-stabilizer','cell':'claire--panic','render_count':0 if render is None else 1,'retry_count':0,'replacement_count':0,'human_gate_authorized':status=='one-cell-machine-pass','production_authorized':False,'license':'GPL-3.0'}
          if render: out['output_sha256']=render['output_sha256']
          Path('evidence/final.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY

      - name: Build new blind human gate only after complete machine PASS
        if: steps.technical.outputs.eligible == 'true' && steps.identity.outputs.eligible == 'true' && steps.french.outputs.eligible == 'true' && steps.emotion.outputs.eligible == 'true'
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          out=Path('evidence/clips/seed-vc.wav'); h=hashlib.sha256(out.read_bytes()).hexdigest()
          claire_first=(int(h[0],16)%2)==0
          refs=[('Claire','source/reference-claire.wav'),('Lucie','source/reference-lucie.wav')]
          if not claire_first: refs.reverse()
          shutil.copy2(refs[0][1],'human/reference-1.wav'); shutil.copy2(refs[1][1],'human/reference-2.wav'); shutil.copy2(out,'human/candidate-a.wav')
          Path('evidence/human-mapping.json').write_text(json.dumps({'reference_1':refs[0][0],'reference_2':refs[1][0],'candidate_target':'Claire','mapping_rule':'output SHA first nibble parity'},indent=2))
          PY
          cat > human/index.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gate humain — Seed-VC Claire panique</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem}.card{border:1px solid #aaa;border-radius:12px;padding:1rem;margin:1rem 0}audio{width:100%}label{display:block;margin:.7rem 0}button{padding:.7rem 1rem}</style></head><body><h1>Gate humain — Claire panique</h1><p>Écoutez les deux références puis A. Ne cherchez pas à identifier la technique utilisée.</p><div class="card"><h2>Référence 1</h2><audio controls src="reference-1.wav"></audio><h2>Référence 2</h2><audio controls src="reference-2.wav"></audio><h2>A — « Vite ! Ils arrivent ! Fermez la porte ! »</h2><audio controls src="candidate-a.wav"></audio></div><h3>À quelle référence correspond A ?</h3><label><input type="radio" name="identity" value="Référence 1"> Référence 1</label><label><input type="radio" name="identity" value="Référence 2"> Référence 2</label><label><input type="radio" name="identity" value="uncertain"> Impossible à distinguer</label><h3>Panique crédible ?</h3><label><input type="radio" name="acting" value="yes"> Oui</label><label><input type="radio" name="acting" value="no"> Non</label><h3>Français naturel et intact ?</h3><label><input type="radio" name="french" value="good"> Oui</label><label><input type="radio" name="french" value="defect"> Non</label><p><button onclick="save()">Exporter le résultat</button></p><script>function pick(n){const x=document.querySelector(`input[name=${n}]:checked`);return x?x.value:null}function save(){const r={schema:'seed-vc-one-cell-human-v1',identity:pick('identity'),acting:pick('acting'),french:pick('french')};if(!r.identity||!r.acting||!r.french){alert('Répondez aux trois questions.');return}const b=new Blob([JSON.stringify(r,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='seed-vc-one-cell-human.json';a.click();URL.revokeObjectURL(a.href)}</script></body></html>
          EOF

      - name: Upload immutable one-cell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-vc-cpu-one-cell-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload blind human gate only after machine PASS
        if: steps.technical.outputs.eligible == 'true' && steps.identity.outputs.eligible == 'true' && steps.french.outputs.eligible == 'true' && steps.emotion.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seed-vc-cpu-one-cell-human-gate
          path: human/
          if-no-files-found: error
          retention-days: 14

      - name: Surface authoritative verdict
        if: always()
        run: |
          test -f evidence/final.json || { echo PRE_RENDER_INFRASTRUCTURE_FAILURE; exit 1; }
          cat evidence/final.json
          STATUS="$(python -c 'import json; print(json.load(open("evidence/final.json"))["status"])')"
          test "$STATUS" = "one-cell-machine-pass" || { echo "verdict: $STATUS"; exit 1; }
          echo SEED_VC_ONE_CELL_MACHINE_PASS_HUMAN_GATE_AUTHORIZED
