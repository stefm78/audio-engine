name: Voice Casting OpenVoice V2 Tone Killer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/openvoice-v2-tone-killer
    paths:
      - src/audio_engine/providers/openvoice_v2_tone_lab.py
      - src/audio_engine/voice_lab_openvoice_v2_tone_killer.py
      - tests/test_voice_lab_openvoice_v2_tone_killer.py
      - .github/workflows/voice-casting-openvoice-v2-tone-killer.yml

permissions:
  contents: read
  actions: read
  issues: write

env:
  OPENVOICE_REV: 74a1d147b17a8c3092dd5430504bd83ef6c7eb23
  OPENVOICE_MODEL_ID: myshell-ai/OpenVoiceV2
  OPENVOICE_MODEL_REV: fd981100305a0e4291f93a9ad169c6d9f7bed54a
  OPENVOICE_CKPT_SHA256: 9652c27e92b6b2a91632590ac9962ef7ae2b712e5c5b7f4c34ec55ee2b37ab9e
  ANCHOR_RUN_ID: "32772435007"
  ANCHOR_ARTIFACT: voice-casting-qwen3-xvector-identity-confirm
  DONOR_RUN_ID: "32811700540"
  DONOR_ARTIFACT: qwen3-style-transplant-donors
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  HF_HUB_DISABLE_TELEMETRY: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Run offline gates
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m unittest tests.test_voice_lab_openvoice_v2_tone_killer -v
      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "OpenVoice V2 tone killer running $GITHUB_RUN_ID" \
            --body "OpenVoice V2 tone-color killer is running.\n\n- run_id: $GITHUB_RUN_ID\n- head: $GITHUB_SHA\n- architecture: existing Qwen VoiceDesign expressive French donor audio -> OpenVoice V2 tone-color conversion -> exact frozen Claire/Lucie identity\n- donors reused exactly from run 32811700540; no Qwen regeneration\n- cases: mystery, wonder, contained sadness\n- final artifact: voice-casting-openvoice-v2-tone-killer\n- human boundary after technical PASS: 3 blind screens\n\nLab only. Production Edge unchanged."

  render:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        character: [claire, lucie]
    env:
      CHARACTER: ${{ matrix.character }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /
      - name: Install core engine
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download exact qualified anchors and frozen expressive donors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$ANCHOR_RUN_ID" --repo "${{ github.repository }}" -n "$ANCHOR_ARTIFACT" -D qualified-anchors
          gh run download "$DONOR_RUN_ID" --repo "${{ github.repository }}" -n "$DONOR_ARTIFACT" -D style-donors
          test -f qualified-anchors/reference-claire-qwen3.wav
          test -f qualified-anchors/reference-lucie-qwen3.wav
          test -f style-donors/mystery.wav
          test -f style-donors/wonder.wav
          test -f style-donors/sadness-contained.wav
          sha256sum qualified-anchors/reference-*-qwen3.wav style-donors/*.wav
      - name: Checkout pinned OpenVoice source
        run: |
          git clone --filter=blob:none https://github.com/myshell-ai/OpenVoice.git openvoice-upstream
          cd openvoice-upstream
          git checkout "$OPENVOICE_REV"
          test "$(git rev-parse HEAD)" = "$OPENVOICE_REV"
      - name: Install isolated CPU conversion stack
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 scipy==1.11.4 soundfile==0.12.1 librosa==0.10.2.post1 \
            eng_to_ipa==0.0.2 inflect==7.0.0 unidecode==1.3.7 pypinyin==0.50.0 \
            cn2an==0.5.22 jieba==0.42.1 langid==1.1.6 huggingface_hub
          python -m pip install --disable-pip-version-check --no-deps -e ./openvoice-upstream
          python - <<'PY'
          from openvoice.api import ToneColorConverter
          print('OpenVoice import OK:', ToneColorConverter.__name__)
          PY
      - name: Download and verify pinned OpenVoice V2 converter
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              repo_id=os.environ['OPENVOICE_MODEL_ID'],
              revision=os.environ['OPENVOICE_MODEL_REV'],
              allow_patterns=['converter/config.json', 'converter/checkpoint.pth'],
              local_dir='openvoice-model',
          )
          print(path)
          PY
          test -f openvoice-model/converter/config.json
          test -f openvoice-model/converter/checkpoint.pth
          echo "$OPENVOICE_CKPT_SHA256  openvoice-model/converter/checkpoint.pth" | sha256sum -c -
      - name: Convert expressive donors to frozen character tone color
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from audio_engine.providers.openvoice_v2_tone_lab import OpenVoiceV2ToneLabProvider
          from audio_engine.voice_lab_openvoice_v2_tone_killer import render_character

          provider = OpenVoiceV2ToneLabProvider(
              config_path=Path('openvoice-model/converter/config.json'),
              checkpoint_path=Path('openvoice-model/converter/checkpoint.pth'),
              device='cpu',
              tau=0.3,
          )
          result = render_character(
              os.environ['CHARACTER'],
              Path('qualified-anchors'),
              Path('style-donors'),
              Path('character-output'),
              provider=provider,
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if result['status'] != 'success' or result['rendered_count'] != 3:
              raise SystemExit(1)
          PY
      - name: Upload character evidence
        uses: actions/upload-artifact@v4
        with:
          name: openvoice-v2-tone-character-${{ matrix.character }}
          path: character-output/
          if-no-files-found: error
          retention-days: 14

  bundle:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install core engine
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download both character artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openvoice-v2-tone-character-*
          path: openvoice-inputs
      - name: Assemble three-screen blind bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from audio_engine.voice_lab_openvoice_v2_tone_killer import assemble_bundle
          result = assemble_bundle(Path('openvoice-inputs'), Path('openvoice-bundle'))
          print(json.dumps({'status': result['status'], 'trial_count': result['trial_count'], 'decision': result['decision']}, ensure_ascii=False, indent=2))
          if result['status'] != 'success' or result['trial_count'] != 3:
              raise SystemExit(1)
          PY
      - name: Upload final blind bundle
        uses: actions/upload-artifact@v4
        with:
          name: voice-casting-openvoice-v2-tone-killer
          path: openvoice-bundle/
          if-no-files-found: error
          retention-days: 14
