name: LOCAL TTS Qwen 0.6B R0 resource gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  ENGINE_REPO: https://github.com/gabriele-mastrapasqua/qwen3-tts.git
  ENGINE_REV: f1b6865713d12a2a2365282fc02e19a5a384a565
  BASE_REPO: Qwen/Qwen3-TTS-12Hz-0.6B-Base
  CUSTOM_REPO: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
  SOURCE_RUN_ID: "32823632721"
  SOURCE_ARTIFACT: voice-casting-qwen3-contrast-emotion-killer-recovery
  CLAIRE_REF_SHA256: 3366f993d108f42525627f1be03e71fdec312b559e067616d2019b69da35cafe
  TEXT: "Vite ! Ils arrivent ! Fermez la porte !"
  HF_HUB_DISABLE_TELEMETRY: "1"
  OMP_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"

jobs:
  r0:
    if: github.head_ref == 'lab/LOCAL-TTS-WP-001-qwen06b-r0'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Freeze R0 contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence source engine models voices
          cat > evidence/contract.json <<JSON
          {
            "schema": "local-tts-qwen06b-r0-v1",
            "status": "contract-frozen",
            "purpose": "resource gate only",
            "runner": "github-hosted ubuntu-24.04 standard public-repo runner",
            "engine_repo": "$ENGINE_REPO",
            "engine_revision": "$ENGINE_REV",
            "base_repo": "$BASE_REPO",
            "custom_repo": "$CUSTOM_REPO",
            "reference_sha256": "$CLAIRE_REF_SHA256",
            "text": "$TEXT",
            "language": "French",
            "emotion": "fear",
            "seed": 42,
            "quantization": "int8",
            "human_review": false,
            "production": false,
            "pass_limits": {
              "peak_rss_gib_lt": 14,
              "sampled_free_disk_gib_gt": 1,
              "wall_clock_minutes_lt": 45
            }
          }
          JSON

      - name: Runner baseline and free disk
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== UNAME ==="; uname -a
            echo "=== CPU ==="; nproc; lscpu
            echo "=== MEMORY ==="; free -h
            echo "=== DISK BEFORE CLEAN ==="; df -h /
          } | tee evidence/runner-baseline.txt
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost || true
          sudo docker system prune -af || true
          sync
          df -B1 / | tee evidence/disk-after-clean.txt

      - name: Recover immutable Claire reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" -n "$SOURCE_ARTIFACT" -D source
          test "$(sha256sum source/reference-claire.wav | cut -d' ' -f1)" = "$CLAIRE_REF_SHA256"
          ffmpeg -hide_banner -loglevel error -y -i source/reference-claire.wav -ar 24000 -ac 1 source/reference-claire-24k.wav
          sha256sum source/reference-claire.wav source/reference-claire-24k.wav | tee evidence/reference-sha256.txt

      - name: Build exact Pure-C engine
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libopenblas-dev ffmpeg libsndfile1 curl ca-certificates
          git clone --filter=blob:none "$ENGINE_REPO" engine/qwen-c
          git -C engine/qwen-c checkout --detach "$ENGINE_REV"
          test "$(git -C engine/qwen-c rev-parse HEAD)" = "$ENGINE_REV"
          cp engine/qwen-c/LICENSE evidence/engine-LICENSE
          /usr/bin/time -v -o evidence/build-time.txt make -C engine/qwen-c blas
          engine/qwen-c/qwen_tts --self-test | tee evidence/engine-self-test.txt

      - name: Resolve exact public model revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          out={}
          for key in ("BASE_REPO","CUSTOM_REPO"):
              repo=os.environ[key]
              with urllib.request.urlopen("https://huggingface.co/api/models/"+repo, timeout=30) as r:
                  data=json.load(r)
              sha=data.get("sha")
              if not sha or len(sha)<20:
                  raise SystemExit(f"could not resolve immutable revision for {repo}")
              out[key]={"repo":repo,"revision":sha}
          Path("evidence/model-revisions.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY

      - name: Install download helper only
        run: python3 -m pip install --disable-pip-version-check "huggingface_hub==0.34.4"

      - name: Download exact 0.6B Base snapshot
        shell: bash
        run: |
          set -euo pipefail
          REV="$(python3 -c 'import json;print(json.load(open("evidence/model-revisions.json"))["BASE_REPO"]["revision"])')"
          /usr/bin/time -v -o evidence/base-download-time.txt python3 - <<PY
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="$BASE_REPO",
              revision="$REV",
              local_dir="models/base",
              ignore_patterns=["*.md",".gitattributes","LICENSE"],
          )
          PY
          du -sb models/base | tee evidence/base-size.txt
          df -B1 / | tee evidence/disk-after-base.txt

      - name: Extract one portable Claire graft
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v -o evidence/base-extract-time.txt engine/qwen-c/qwen_tts             -d models/base             --ref-audio source/reference-claire-24k.wav             -l French             --save-voice voices/claire.qvoice             --voice-name Claire             2>&1 | tee evidence/base-extract.log
          test -s voices/claire.qvoice
          sha256sum voices/claire.qvoice | tee evidence/claire-qvoice-sha256.txt
          python3 engine/qwen-c/tests/qvoice_anatomy.py voices/claire.qvoice | tee evidence/claire-qvoice-anatomy.txt
          rm -rf models/base
          rm -rf ~/.cache/huggingface/hub/models--Qwen--Qwen3-TTS-12Hz-0.6B-Base || true
          sync
          df -B1 / | tee evidence/disk-after-base-delete.txt

      - name: Download exact 0.6B CustomVoice snapshot
        shell: bash
        run: |
          set -euo pipefail
          REV="$(python3 -c 'import json;print(json.load(open("evidence/model-revisions.json"))["CUSTOM_REPO"]["revision"])')"
          /usr/bin/time -v -o evidence/custom-download-time.txt python3 - <<PY
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="$CUSTOM_REPO",
              revision="$REV",
              local_dir="models/custom",
              ignore_patterns=["*.md",".gitattributes","LICENSE"],
          )
          PY
          du -sb models/custom | tee evidence/custom-size.txt
          df -B1 / | tee evidence/disk-after-custom.txt

      - name: Render exactly one French fear resource sample
        shell: bash
        run: |
          set -euo pipefail
          pushd engine/qwen-c >/dev/null
          /usr/bin/time -v -o ../../evidence/render-time.txt ./qwen_tts             -d ../../models/custom             --load-voice ../../voices/claire.qvoice             --icl-only             --int8             -l French             --emotion fear             --seed 42             --max-duration 8             --text "$TEXT"             -o ../../evidence/r0-candidate.wav             2>&1 | tee ../../evidence/render.log
          popd >/dev/null
          test -s evidence/r0-candidate.wav
          sha256sum evidence/r0-candidate.wav | tee evidence/r0-candidate-sha256.txt
          ffprobe -v error -show_entries stream=sample_rate,channels,duration -of json evidence/r0-candidate.wav | tee evidence/audio-probe.json
          df -B1 / | tee evidence/disk-after-render.txt

      - name: Build authoritative R0 verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, wave, math, struct
          from pathlib import Path

          def rss_kib(path):
              text=Path(path).read_text(errors="replace")
              m=re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", text)
              return int(m.group(1)) if m else None

          def elapsed_seconds(path):
              text=Path(path).read_text(errors="replace")
              m=re.search(r"Elapsed \(wall clock\) time.*?:\s*([0-9:.]+)", text)
              if not m: return None
              parts=[float(x) for x in m.group(1).split(":")]
              if len(parts)==2: return parts[0]*60+parts[1]
              if len(parts)==3: return parts[0]*3600+parts[1]*60+parts[2]
              return parts[0]

          free_samples={}
          for p in Path("evidence").glob("disk-*.txt"):
              lines=[x for x in p.read_text().splitlines() if x.startswith("/dev/")]
              if lines:
                  cols=lines[-1].split()
                  free_samples[p.name]=int(cols[3])
          min_free=min(free_samples.values()) if free_samples else 0

          with wave.open("evidence/r0-candidate.wav","rb") as w:
              sr=w.getframerate(); ch=w.getnchannels(); n=w.getnframes(); sw=w.getsampwidth(); raw=w.readframes(n)
          if sw!=2: raise SystemExit("unexpected sample width")
          vals=struct.unpack("<"+"h"*(len(raw)//2), raw)
          if ch>1: vals=vals[::ch]
          rms=(sum((v/32768.0)**2 for v in vals)/max(1,len(vals)))**0.5
          duration=len(vals)/sr

          rss={
              "build":rss_kib("evidence/build-time.txt"),
              "base_download":rss_kib("evidence/base-download-time.txt"),
              "base_extract":rss_kib("evidence/base-extract-time.txt"),
              "custom_download":rss_kib("evidence/custom-download-time.txt"),
              "render":rss_kib("evidence/render-time.txt"),
          }
          peak=max(v for v in rss.values() if v is not None)
          render_s=elapsed_seconds("evidence/render-time.txt")
          rtf=(render_s/duration) if render_s and duration else None
          revisions=json.loads(Path("evidence/model-revisions.json").read_text())
          signals={
              "24khz":sr==24000,
              "mono":ch==1,
              "duration_ok":0.5<=duration<8.0,
              "non_silent":rms>1e-5,
              "peak_rss_lt_14gib":peak < 14*1024*1024,
              "sampled_free_disk_gt_1gib":min_free > 1024**3,
              "emotion_flag_seen":"Emotion 'fear'" in Path("evidence/render.log").read_text(errors="replace"),
          }
          ok=all(signals.values())
          out={
              "schema":"local-tts-qwen06b-r0-v1",
              "status":"pass" if ok else "reject",
              "scientific_cell_authorized":bool(ok),
              "engine_revision":"f1b6865713d12a2a2365282fc02e19a5a384a565",
              "model_revisions":revisions,
              "audio":{"sample_rate":sr,"channels":ch,"duration_seconds":duration,"rms":rms},
              "resource":{"peak_rss_kib":peak,"rss_kib":rss,"min_sampled_free_disk_bytes":min_free,"free_disk_samples":free_samples,"render_wall_seconds":render_s,"rtf":rtf},
              "signals":signals,
              "human_review":False,
              "production":False,
          }
          Path("evidence/r0-verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          if not ok: raise SystemExit("R0_RESOURCE_REJECT")
          PY

      - name: Upload R0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-tts-qwen06b-r0-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14
