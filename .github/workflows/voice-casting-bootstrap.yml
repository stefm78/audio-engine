name: Voice Casting Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/voice-casting-bootstrap.yml

jobs:
  expressive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Render French provider expressive campaign
        run: |
          set -euo pipefail
          audio-engine voice-lab render --scope provider --stage expressive --out voice-lab-output | tee voice-lab-result.json

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-casting-provider-expressive
          path: |
            voice-lab-output/
            voice-lab-result.json
          if-no-files-found: warn
          retention-days: 14
