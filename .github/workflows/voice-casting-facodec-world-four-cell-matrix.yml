      - name: Record Steve and Linus matrix verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def rd(n):
            p=Path(f'evidence/{n}.json');return json.loads(p.read_text(encoding='utf-8')) if p.is_file() else None
          technical=rd('technical');french=rd('french');identity=rd('identity');emotion=rd('emotion')
          if technical is None or technical.get('status')!='pass':status='technical-reject' if technical else 'infrastructure-incomplete';decision='Four-cell WORLD matrix failed technical integrity or produced no technical evidence.'
          elif french is None:status='infrastructure-incomplete';decision='Technical matrix passed but French verifier produced no evidence.'
          elif french.get('status')!='pass':status='french-reject';decision='Steve veto: at least one WORLD-restored cell worsens French beyond its immutable expressive-source baseline. Retire without tuning.'
          elif identity is None:status='infrastructure-incomplete';decision='French passed but independent identity verifier produced no evidence.'
          elif identity.get('status')!='pass':status='identity-reject';decision='Steve veto: four-cell WORLD matrix fails target identity or cross-emotion identity topology. Retire without tuning.'
          elif emotion is None:status='infrastructure-incomplete';decision='Identity passed but source-valid emotion verifier produced no evidence.'
          elif emotion.get('status')!='pass':status='emotion-reject';decision='Steve veto: at least one WORLD-restored cell does not preserve the intended source-relative emotion. Retire without tuning.'
          else:status='four-cell-machine-pass';decision='All four WORLD-restored cells pass technical integrity, French no-worse-than-source, independent target identity + topology, and source-relative emotion. Authorize minimal blind human gate; no production promotion yet.'
          final={'status':status,'decision':decision,'human_gate_authorized':status=='four-cell-machine-pass','production_qualified':False,'pages_published':False,'parameter_tuning':False,'new_tts':False,'new_neural_voice_conversion':False}
          Path('evidence/final.json').write_text(json.dumps(final,indent=2),encoding='utf-8');print(json.dumps(final,indent=2))
          PY

