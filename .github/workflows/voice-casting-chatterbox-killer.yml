name: Voice Casting Chatterbox V3 Killer Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/voice-casting-chatterbox-killer.yml

permissions:
  contents: read
  issues: write

jobs:
  chatterbox-killer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      CHATTERBOX_REV: 3f35dfc8fbe63e5b29793289dc68f1875bb317a5

    steps:
      - uses: actions/checkout@v6

      - name: Publish run locator immediately
        id: locator
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ISSUE_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "Voice Casting Chatterbox V3 killer running $RUN_ID" \
            --body "Open/local Chatterbox Multilingual V3 killer test started.\n\n- run_id: $RUN_ID\n- run: $RUN_URL\n- status: running\n- upstream revision: $CHATTERBOX_REV\n- reference identity: synthetic Edge Vivienne, French\n- cases: panic + mystery\n- design: Edge baseline vs Chatterbox neutral/dramatic/strong\n\nThis locator is created before heavy model installation so failures remain diagnosable. Lab evidence only; no production promotion.")
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache public Chatterbox model files
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: chatterbox-multilingual-v3-${{ env.CHATTERBOX_REV }}

      - name: Install core engine
        run: python -m pip install --disable-pip-version-check -e .

      - name: Verify isolated experiment contract
        run: python -m unittest tests.test_voice_lab_chatterbox_killer -v

      - name: Install pinned upstream Chatterbox V3 source
        run: |
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/resemble-ai/chatterbox.git@${CHATTERBOX_REV}"
          python -m pip check
          df -h .

      - name: Verify V3 API before model initialization
        run: |
          python - <<'PY'
          import inspect
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS

          params = inspect.signature(ChatterboxMultilingualTTS.from_pretrained).parameters
          if "t3_model" not in params:
              raise SystemExit(
                  "Pinned Chatterbox source does not expose from_pretrained(..., t3_model=...)."
              )
          languages = ChatterboxMultilingualTTS.get_supported_languages()
          if "fr" not in languages:
              raise SystemExit("Pinned Chatterbox source does not advertise French support.")
          print("Chatterbox V3 API verified; French supported.")
          PY

      - name: Render 2-case CPU killer test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from audio_engine.voice_lab_chatterbox_killer import render_experiment

          result = render_experiment(Path("chatterbox-killer-output"))
          print(json.dumps({
              "status": result["status"],
              "rendered_count": result["rendered_count"],
              "failure_count": result["failure_count"],
              "case_count": len(result["cases"]),
          }, indent=2))
          if result["status"] != "success":
              print(json.dumps(result["failures"], indent=2, ensure_ascii=False))
              raise SystemExit(1)
          PY

      - name: Upload blind listening bundle
        uses: actions/upload-artifact@v4
        with:
          name: voice-casting-chatterbox-v3-killer
          path: chatterbox-killer-output/
          if-no-files-found: error
          retention-days: 14

      - name: Mark locator completed
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.locator.outputs.issue_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ISSUE_NUMBER="${ISSUE_URL##*/}"
          gh issue edit "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --title "Voice Casting Chatterbox V3 killer completed $RUN_ID" \
            --body "Open/local Chatterbox Multilingual V3 killer test completed.\n\n- run_id: $RUN_ID\n- run: $RUN_URL\n- status: completed\n- artifact: voice-casting-chatterbox-v3-killer\n- upstream revision: $CHATTERBOX_REV\n- reference identity: synthetic Edge Vivienne, French\n- cases: panic + mystery\n- design: Edge baseline vs Chatterbox neutral/dramatic/strong\n- 8 comparison clips / 2 blind decisions\n\nLab evidence only. No production dependency or provider promotion."

      - name: Mark locator failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.locator.outputs.issue_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ISSUE_URL" ]; then
            echo "No locator issue was created; nothing to update."
            exit 0
          fi
          ISSUE_NUMBER="${ISSUE_URL##*/}"
          gh issue edit "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --title "Voice Casting Chatterbox V3 killer failed $RUN_ID" \
            --body "Open/local Chatterbox Multilingual V3 killer test failed.\n\n- run_id: $RUN_ID\n- run: $RUN_URL\n- status: failed\n- upstream revision: $CHATTERBOX_REV\n\nInspect the workflow logs for the exact failed step. Lab evidence only; no production dependency or provider promotion."
