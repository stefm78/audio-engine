name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Offline smoke tests
        run: python -m unittest discover -s tests -v
      - name: Validate public catalogs and example contracts
        run: |
          audio-engine voices
          audio-engine ambiences
          audio-engine sounds
          audio-engine validate examples/minimal.json
          audio-engine validate examples/dialogue.json
          audio-engine validate examples/soundscape.json
      - name: Provider smoke evidence
        continue-on-error: true
        run: audio-engine render examples/minimal.json --out .provider-smoke
      - name: Autonomous hydrated library evidence
        continue-on-error: true
        run: |
          audio-engine sound hydrate examples/sound-requirements-smoke.json --out .hydration-smoke
          audio-engine sounds --catalog .hydration-smoke/sounds.json --id ci-pretiosa
      - name: Generic eligible discovery evidence
        continue-on-error: true
        run: |
          audio-engine sound ensure "cathedral bell" \
            --type event \
            --id ci-generic-cathedral-bell \
            --provider wikimedia-commons \
            --provider openverse \
            --require-tag bell \
            --prefer-tag cathedral \
            --prefer-tag church \
            --prefer-tag distant \
            --out .generic-discovery-smoke \
            --limit 8 \
            --min-score 70
