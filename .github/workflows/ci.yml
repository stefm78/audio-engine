name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Offline smoke tests
        run: python -m unittest discover -s tests -v
      - name: Validate public catalogs and example contracts
        run: |
          audio-engine voices
          audio-engine ambiences
          audio-engine sounds
          audio-engine validate examples/minimal.json
          audio-engine validate examples/dialogue.json
          audio-engine validate examples/soundscape.json
      - name: Provider smoke evidence
        continue-on-error: true
        run: audio-engine render examples/minimal.json --out .provider-smoke
      - name: Autonomous Commons acquisition evidence
        continue-on-error: true
        run: |
          audio-engine sound ensure "200357 bigben12345 pretiosa" \
            --type event \
            --id ci-pretiosa \
            --provider wikimedia-commons \
            --out .acquisition-smoke \
            --limit 5 \
            --min-score 60
