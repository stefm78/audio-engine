name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Offline smoke tests
        run: python -m unittest discover -s tests -v
      - name: Validate public catalogs and example contracts
        run: |
          audio-engine voices
          audio-engine ambiences
          audio-engine sounds
          audio-engine validate examples/minimal.json
          audio-engine validate examples/dialogue.json
          audio-engine validate examples/soundscape.json
      - name: Provider smoke evidence
        continue-on-error: true
        run: audio-engine render examples/minimal.json --out .provider-smoke
      - name: Autonomous hydrated library evidence
        continue-on-error: true
        run: |
          audio-engine sound hydrate examples/sound-requirements-smoke.json --out .hydration-smoke
          audio-engine sounds --catalog .hydration-smoke/sounds.json --id ci-pretiosa
      - name: Generic eligible hydration evidence
        continue-on-error: true
        run: |
          cat > .generic-sound-requirements.json <<'JSON'
          {
            "version": 1,
            "sounds": [
              {
                "id": "ci-generic-cathedral-bell",
                "type": "event",
                "query": "cathedral bell",
                "required_tags": ["bell"],
                "preferred_tags": ["cathedral", "church", "distant"],
                "providers": ["wikimedia-commons", "openverse"],
                "limit": 8,
                "min_score": 70
              }
            ]
          }
          JSON
          audio-engine sound hydrate .generic-sound-requirements.json --out .generic-hydration-smoke
          audio-engine sounds --catalog .generic-hydration-smoke/sounds.json --id ci-generic-cathedral-bell
