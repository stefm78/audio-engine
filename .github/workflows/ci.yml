name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Offline smoke tests
        run: python -m unittest discover -s tests -v
      - name: Validate example contracts
        run: |
          audio-engine validate examples/minimal.json
          audio-engine validate examples/dialogue.json
      - name: Provider smoke evidence
        continue-on-error: true
        run: audio-engine render examples/minimal.json --out .provider-smoke
