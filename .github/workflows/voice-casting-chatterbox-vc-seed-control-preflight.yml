name: Voice Casting Chatterbox VC Seed Control Preflight

on:
  push:
    branches:
      - lab/chatterbox-vc-seed-control-preflight
    paths:
      - .github/workflows/voice-casting-chatterbox-vc-seed-control-preflight.yml

permissions:
  contents: read
  actions: read

env:
  CHATTERBOX_REPO: https://github.com/resemble-ai/chatterbox.git
  CHATTERBOX_REV: 5de7a54aa4e5e2baadb0182dde554908b48b85c2
  PERTH_REV: ce86c49d029f42272c1902eccb675556b9ed2330
  MODEL_REPO: ResembleAI/chatterbox
  MODEL_REV: 5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18
  CONDS_SHA256: 6552d70568833628ba019c6b03459e77fe71ca197d5c560cef9411bee9d87f4e
  S3GEN_SHA256: 2b78103c654207393955e4900aac14a12de8ef25f4b09424f1ef91941f161d4e
  SOURCE_RUN_ID: "32723874223"
  SOURCE_ARTIFACT: voice-casting-chatterbox-v3-stage2
  HF_HUB_DISABLE_TELEMETRY: "1"
  PIP_NO_CACHE_DIR: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  seed-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Freeze non-scientific reproducibility contract
        run: |
          mkdir -p evidence probe weights upstream
          python - <<'PY'
          import json,os
          from pathlib import Path
          c={
            "schema":"chatterbox-vc-seed-control-preflight-v1",
            "purpose":"non-scientific seed-control and reload reproducibility proof",
            "scientific_audio_used":False,
            "upstream_revision":os.environ["CHATTERBOX_REV"],
            "perth_revision":os.environ["PERTH_REV"],
            "model_revision":os.environ["MODEL_REV"],
            "probe_source":"historical synthetic Edge Vivienne panic from Chatterbox Stage2 artifact",
            "probe_target":"historical synthetic Edge William reference from Chatterbox Stage2 artifact",
            "procedure":[
              "load model instance A",
              "reset Python/NumPy/Torch RNGs to seed 0 immediately before conversion -> output A",
              "reset RNGs to seed 1 immediately before conversion on same model -> output B",
              "destroy model and reload fresh model instance C",
              "reset RNGs to seed 0 immediately before conversion -> output C"
            ],
            "pass_rule":"A and C must be bit-identical WAV files; B must differ from A; all three finite/non-silent/native 24 kHz",
            "next_if_pass":"bounded scientific candidate selection may use explicit post-load seeds",
            "next_if_fail":"seed-based bounded selection is rejected as non-reproducible or ineffective",
            "production":False
          }
          Path("evidence/contract.json").write_text(json.dumps(c,indent=2))
          print(json.dumps(c,indent=2))
          PY

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          sudo docker system prune -af || true
          df -h /

      - name: Recover non-scientific synthetic probe material
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" -n "$SOURCE_ARTIFACT" -D probe
          test -s probe/clips/vivienne--panic--edge.wav
          test -s probe/reference-william-edge-16k.wav
          sha256sum probe/clips/vivienne--panic--edge.wav probe/reference-william-edge-16k.wav | tee evidence/probe-input-sha256.txt

      - name: Install exact CPU ChatterboxVC runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
          git clone --filter=blob:none "$CHATTERBOX_REPO" upstream/chatterbox
          git -C upstream/chatterbox checkout --detach "$CHATTERBOX_REV"
          test "$(git -C upstream/chatterbox rev-parse HEAD)" = "$CHATTERBOX_REV"
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path("upstream/chatterbox/pyproject.toml"); raw=p.read_bytes()
          s=raw.decode(); old="resemble-perth @ git+https://github.com/resemble-ai/Perth.git@master"; new=f"resemble-perth @ git+https://github.com/resemble-ai/Perth.git@{os.environ['PERTH_REV']}"
          if s.count(old)!=1: raise SystemExit("unexpected Perth dependency form")
          before=hashlib.sha256(raw).hexdigest(); p.write_text(s.replace(old,new),encoding="utf-8"); after=hashlib.sha256(p.read_bytes()).hexdigest()
          Path("evidence/packaging-patch.txt").write_text(f"original_pyproject_sha256={before}\npatched_pyproject_sha256={after}\nchange=Perth master -> {os.environ['PERTH_REV']}\nscience_code_changed=false\n")
          PY
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          python -m pip install --disable-pip-version-check -e upstream/chatterbox
          python -m pip install --disable-pip-version-check psutil==6.1.1
          python -m pip check
          python - <<'PY'
          import torch
          assert not torch.cuda.is_available()
          print("CPU_ONLY_PASS",torch.__version__)
          PY

      - name: Download and verify exact VC weights
        run: |
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          root=Path(snapshot_download(repo_id=os.environ["MODEL_REPO"],revision=os.environ["MODEL_REV"],allow_patterns=["s3gen.safetensors","conds.pt"],local_dir="weights/chatterbox-vc"))
          expected={"conds.pt":(107374,os.environ["CONDS_SHA256"]),"s3gen.safetensors":(1056484620,os.environ["S3GEN_SHA256"])}
          for name,(size,sha) in expected.items():
              p=root/name
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(8*1024*1024),b""): h.update(chunk)
              got=(p.stat().st_size,h.hexdigest())
              if got!=(size,sha): raise SystemExit((name,got))
          print("WEIGHTS_PASS")
          PY

      - name: Prove seed control across a fresh model reload
        id: probe
        continue-on-error: true
        run: |
          /usr/bin/time -v -o evidence/seed-control-time.txt python - <<'PY'
          import gc,hashlib,json,random,resource,time
          from pathlib import Path
          import numpy as np,soundfile as sf,torch
          from chatterbox.vc import ChatterboxVC

          source="probe/clips/vivienne--panic--edge.wav"
          target="probe/reference-william-edge-16k.wav"

          def reset(seed):
              random.seed(seed); np.random.seed(seed); torch.manual_seed(seed)

          def convert(model,seed,label):
              reset(seed)
              started=time.time()
              wav=model.generate(audio=source,target_voice_path=target)
              wall=time.time()-started
              y=wav.squeeze(0).detach().cpu().numpy().astype(np.float32); sr=int(model.sr)
              p=Path(f"evidence/{label}.wav"); sf.write(p,y,sr)
              return {
                "label":label,"seed":seed,"sample_rate":sr,"duration_seconds":float(y.size/sr),
                "rms":float(np.sqrt(np.mean(y*y))) if y.size else 0.0,
                "finite":bool(np.isfinite(y).all()) if y.size else False,
                "wall_seconds":wall,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()
              }

          model=ChatterboxVC.from_local("weights/chatterbox-vc","cpu")
          a=convert(model,0,"seed0-a")
          b=convert(model,1,"seed1")
          del model; gc.collect()
          model=ChatterboxVC.from_local("weights/chatterbox-vc","cpu")
          c=convert(model,0,"seed0-c-reload")

          rows=[a,b,c]
          basic=all(r["sample_rate"]==24000 and r["duration_seconds"]>0 and r["rms"]>1e-5 and r["finite"] for r in rows)
          same_seed_repro=(a["sha256"]==c["sha256"])
          seed_effect=(a["sha256"]!=b["sha256"])
          ok=basic and same_seed_repro and seed_effect
          out={
            "status":"pass" if ok else "reject",
            "basic_audio_pass":basic,
            "same_seed_across_reload_bit_identical":same_seed_repro,
            "different_seed_changes_output":seed_effect,
            "rows":rows,
            "max_rss_kib":resource.getrusage(resource.RUSAGE_SELF).ru_maxrss,
            "cuda_available":torch.cuda.is_available()
          }
          Path("evidence/result.json").write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if not ok: raise SystemExit("seed-control preflight reject")
          PY

      - name: Record authoritative preflight verdict
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("evidence/result.json").read_text()) if Path("evidence/result.json").exists() else None
          ok=os.environ["PROBE_OUTCOME"]=="success" and r is not None and r.get("status")=="pass"
          out={"status":"seed-control-pass" if ok else "seed-control-reject","bounded_selection_authorized_next":bool(ok),"production":False}
          Path("evidence/final.json").write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY

      - name: Upload seed-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-vc-seed-control-preflight
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Surface seed-control verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("evidence/final.json").read_text())["status"]
          if s!="seed-control-pass": raise SystemExit(f"verdict: {s}")
          print("SEED_CONTROL_PASS")
          PY
