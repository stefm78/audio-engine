name: LAB Qwen3 XVector Identity Confirm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lab-qwen3-xvector-identity-confirm.yml

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  qwen3-xvector-identity-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPERIMENT_REF: feature/qwen3-xvector-identity-confirm
      QWEN_REV: 022e286b98fbec7e1e916cb940cdf532cd9f488e
      MODEL_ID: Qwen/Qwen3-TTS-12Hz-1.7B-Base
      MODEL_REV: 74a6279626edc2d5a787d5b6467668eba0b86ef6
      SOURCE_RUN_ID: "32754167011"
      SOURCE_ARTIFACT: voice-casting-qwen3-voicedesign-killer
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_NO_CACHE_DIR: "1"

    steps:
      - name: Checkout frozen experiment branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPERIMENT_REF }}

      - name: Publish run locator
        id: locator
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ISSUE_URL=$(gh issue create --repo "${{ github.repository }}" \
            --title "Qwen3 x-vector identity confirmation running $RUN_ID" \
            --body "Single narrow confirmation after borderline 3/4 identity.\n\n- run_id: $RUN_ID\n- run: $RUN_URL\n- experiment_ref: $EXPERIMENT_REF\n- base model: $MODEL_ID @ $MODEL_REV\n- anchors: byte-for-byte from run $SOURCE_RUN_ID artifact $SOURCE_ARTIFACT\n- mode: x_vector_only\n- new probe: Non ! Ne restez pas là ! Sortez, maintenant !\n- output: 2 generated clips + 2 frozen references\n- human boundary: exactly 2 ABX identity decisions + French validity\n- pass: 2/2 identity and no French defect\n- no tuning, no Edge control, no production promotion."
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Install core engine and run offline tests
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m unittest tests.test_voice_lab_qwen3_xvector_identity_confirm -v

      - name: Download frozen character anchors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" -n "$SOURCE_ARTIFACT" -D prior-qwen3
          test -f prior-qwen3/reference-claire-qwen3.wav
          test -f prior-qwen3/reference-lucie-qwen3.wav
          sha256sum prior-qwen3/reference-*-qwen3.wav

      - name: Checkout pinned Qwen3-TTS source
        run: |
          git clone --filter=blob:none https://github.com/QwenLM/Qwen3-TTS.git qwen3-upstream
          cd qwen3-upstream
          git checkout "$QWEN_REV"
          test "$(git rev-parse HEAD)" = "$QWEN_REV"

      - name: Install isolated CPU inference stack
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          python -m pip install --disable-pip-version-check -e ./qwen3-upstream
          python -m pip check

      - name: Download pinned Qwen3 Base model
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          p = snapshot_download(repo_id=os.environ['MODEL_ID'], revision=os.environ['MODEL_REV'], local_dir='qwen3-base-model')
          print(p)
          PY
          test -f qwen3-base-model/config.json
          test -f qwen3-base-model/model.safetensors

      - name: Render narrow identity confirmation on CPU
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          from audio_engine.voice_lab_qwen3_xvector_identity_confirm import render_experiment
          started = time.monotonic()
          result = render_experiment(
              Path('qwen3-xvector-confirm-output'),
              reference_dir=Path('prior-qwen3'),
              model_dir=Path('qwen3-base-model'),
          )
          print(json.dumps({
              'status': result['status'],
              'rendered_count': result['rendered_count'],
              'failure_count': result['failure_count'],
              'elapsed_s': round(time.monotonic()-started, 1),
              'reference_hashes': {k:v['sha256'] for k,v in result['references'].items()},
          }, indent=2))
          if result['status'] != 'success' or result['rendered_count'] != 2 or len(result['references']) != 2:
              print(json.dumps(result['failures'], ensure_ascii=False, indent=2))
              raise SystemExit(1)
          PY

      - name: Upload blind listening bundle
        uses: actions/upload-artifact@v4
        with:
          name: voice-casting-qwen3-xvector-identity-confirm
          path: qwen3-xvector-confirm-output/
          if-no-files-found: error
          retention-days: 14

      - name: Mark locator completed
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.locator.outputs.issue_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          N="${ISSUE_URL##*/}"
          gh issue edit "$N" --repo "${{ github.repository }}" \
            --title "Qwen3 x-vector identity confirmation completed $RUN_ID" \
            --body "Narrow x-vector identity confirmation completed.\n\n- run_id: $RUN_ID\n- artifact: voice-casting-qwen3-xvector-identity-confirm\n- anchors: exact prior VoiceDesign references, not regenerated\n- mode: speaker embedding only\n- output: 2 new high-arousal clips + 2 frozen references\n- human boundary: 2 ABX identity decisions + French validity\n\nOpen index.html and export qwen3-xvector-identity-confirm-results.json. Pass requires 2/2 identity and no French defect. No production promotion."

      - name: Mark locator failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.locator.outputs.issue_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$ISSUE_URL" ]; then exit 0; fi
          N="${ISSUE_URL##*/}"
          gh issue edit "$N" --repo "${{ github.repository }}" \
            --title "Qwen3 x-vector identity confirmation failed $RUN_ID" \
            --body "Narrow x-vector identity confirmation failed technically.\n\n- run_id: $RUN_ID\n- no artistic verdict. Production unchanged."
