name: LOCAL TTS P6 Ulysse Qwen3 hybrid

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  QWEN_REV: 022e286b98fbec7e1e916cb940cdf532cd9f488e
  MODEL_ID: Qwen/Qwen3-TTS-12Hz-1.7B-Base
  MODEL_REV: 74a6279626edc2d5a787d5b6467668eba0b86ef6
  DONOR_RUN_ID: "32811700540"
  DONOR_ARTIFACT: qwen3-style-transplant-donors
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  HF_HUB_DISABLE_TELEMETRY: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  p6-qwen3-hybrid:
    if: github.head_ref == 'lab/LOCAL-TTS-WP-004-p6-qwen3-hybrid'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Install ffmpeg before audio operations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg time

      - name: Recover immutable H1b-B P6 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/h1b
          gh release download odyssee-h1b-corrective-review-v1             --repo stefm78/recit-audioguide             -p p6-b.mp3             -p p6-b-report.json             -D inputs/h1b

          test "$(sha256sum inputs/h1b/p6-b.mp3 | cut -d' ' -f1)" =             "474c2e41a5d702b2a84524aa3be9a0559ed7378af18d507ac082b666029d64ae"
          test "$(sha256sum inputs/h1b/p6-b-report.json | cut -d' ' -f1)" =             "366091a73e7597626384535e900a5b30e7943c485d0197ec25f015c384b6d891"

      - name: Recover exact historical contained-sadness donor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/donor
          gh run download "$DONOR_RUN_ID"             --repo "${{ github.repository }}"             -n "$DONOR_ARTIFACT"             -D inputs/donor

          test -f inputs/donor/sadness-contained.wav
          test -f inputs/donor/donors.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("inputs/donor/donors.json").read_text())
          r=[x for x in d["records"] if x["id"]=="sadness-contained"]
          assert len(r)==1
          assert r[0]["text"]=="Je savais que ce jour viendrait... mais cela fait quand même mal."
          assert int(r[0]["seed"])==2026082503
          print("P6_DONOR_PROVENANCE_PASS")
          PY
          sha256sum inputs/donor/sadness-contained.wav inputs/donor/donors.json

      - name: Static protocol gate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             src/audio_engine/providers/qwen3_style_transplant_lab.py             lab/voice-casting/p6_qwen3_hybrid.py
          ! grep -R -n -E 'AZURE_SPEECH|edge_tts|EdgeProvider|speech\.microsoft|cognitiveservices'             src/audio_engine/providers/qwen3_style_transplant_lab.py             lab/voice-casting/p6_qwen3_hybrid.py
          python - <<'PY'
          import ast
          from pathlib import Path
          t=ast.parse(Path("lab/voice-casting/p6_qwen3_hybrid.py").read_text())
          values={}
          for n in t.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name):
                  if n.targets[0].id in {"ANCHOR_SEGMENTS","TARGETS","SEEDS"}:
                      values[n.targets[0].id]=ast.literal_eval(n.value)
          assert values["ANCHOR_SEGMENTS"]==(6,7,8)
          assert set(values["TARGETS"])=={2,4,10,12,15}
          assert set(values["SEEDS"])=={2,4,10,12,15}
          print("P6_PROTOCOL_STATIC_PASS")
          PY

      - name: Checkout pinned Qwen3-TTS source
        run: |
          git clone --filter=blob:none https://github.com/QwenLM/Qwen3-TTS.git qwen3-upstream
          cd qwen3-upstream
          git checkout "$QWEN_REV"
          test "$(git rev-parse HEAD)" = "$QWEN_REV"

      - name: Install isolated CPU inference stack
        run: |
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             torch torchaudio
          python -m pip install --disable-pip-version-check             pydub==0.25.1 soundfile==0.12.1 numpy==1.26.4
          python -m pip install --disable-pip-version-check -e ./qwen3-upstream
          python -m pip check

      - name: Download pinned Qwen3 Base model
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          p=snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              revision=os.environ["MODEL_REV"],
              local_dir="qwen3-base-model",
          )
          print(p)
          PY
          test -f qwen3-base-model/config.json
          test -f qwen3-base-model/model.safetensors

      - name: Render one frozen P6 real-scene candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/p6-qwen3-hybrid
          /usr/bin/time -v             python lab/voice-casting/p6_qwen3_hybrid.py               --model-dir qwen3-base-model               --baseline-audio inputs/h1b/p6-b.mp3               --baseline-report inputs/h1b/p6-b-report.json               --donor-dir inputs/donor               --out generated/p6-qwen3-hybrid             2> >(tee generated/p6-qwen3-hybrid/resource-time.txt >&2)

          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("generated/p6-qwen3-hybrid/manifest.json").read_text())
          assert m["status"]=="MACHINE_PASS"
          assert m["cloud_tts"] is False
          assert m["nuc_required"] is False
          assert len(m["slots"])==5
          assert [s["i"] for s in m["slots"]]==[2,4,10,12,15]
          assert all(s["technical_gate"]["status"]=="PASS" for s in m["slots"])
          assert m["modes"]["xvector_lines"]==[2,4]
          assert m["modes"]["contained_sadness_lines"]==[10,12,15]
          print("P6_QWEN3_HYBRID_MACHINE_PASS")
          PY

          sha256sum             generated/p6-qwen3-hybrid/p6-qwen3-hybrid.mp3             generated/p6-qwen3-hybrid/ulysse-henri-anchor.wav             generated/p6-qwen3-hybrid/slots/*.wav             generated/p6-qwen3-hybrid/manifest.json             | tee generated/p6-qwen3-hybrid/SHA256SUMS.txt

      - name: Upload immutable P6 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-tts-p6-qwen3-hybrid
          path: |
            generated/p6-qwen3-hybrid/p6-qwen3-hybrid.mp3
            generated/p6-qwen3-hybrid/ulysse-henri-anchor.wav
            generated/p6-qwen3-hybrid/slots/*.wav
            generated/p6-qwen3-hybrid/manifest.json
            generated/p6-qwen3-hybrid/SHA256SUMS.txt
            generated/p6-qwen3-hybrid/resource-time.txt
          if-no-files-found: warn
          retention-days: 14
