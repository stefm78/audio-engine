name: Voice Casting Azure Expressive Duel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/voice-casting-azure-duel.yml

permissions:
  contents: read
  issues: write

jobs:
  expressive-duel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Check lab credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ] || [ -z "$AZURE_SPEECH_REGION" ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "Voice Casting Azure duel needs Speech secrets" \
              --body "The lab-only Azure expressive duel is ready but cannot synthesize yet.\n\nAdd repository Actions secrets:\n- AZURE_SPEECH_KEY\n- AZURE_SPEECH_REGION\n\nThen run **Voice Casting Azure Expressive Duel** again.\n\nRun: $RUN_URL\nRun id: $RUN_ID\n\nNo production render path depends on these secrets."
            exit 1
          fi

      - name: Render controlled and MAI expressive duel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from audio_engine.voice_lab_expressive_duel import render_experiment

          result = render_experiment(Path("azure-duel-output"))
          print(json.dumps({
              "status": result["status"],
              "rendered_count": result["rendered_count"],
              "failure_count": result["failure_count"],
              "case_count": len(result["cases"]),
          }, indent=2))
          if result["status"] != "success":
              raise SystemExit(1)
          PY

      - name: Upload blind-listening evidence
        uses: actions/upload-artifact@v4
        with:
          name: voice-casting-azure-expressive-duel
          path: azure-duel-output/
          if-no-files-found: error
          retention-days: 14

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Voice Casting Azure expressive duel $RUN_ID" \
            --body "Azure expressive-provider duel completed.\n\n- run_id: $RUN_ID\n- run: $RUN_URL\n- artifact: voice-casting-azure-expressive-duel\n- design: 4 controlled same-base-voice cases + 8 French MAI-Voice-2 ceiling cases\n- 48 clips / 12 blind decisions\n\nThis is lab evidence only; no provider is promoted to production by this run."
