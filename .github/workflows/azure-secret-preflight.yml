name: Azure Speech secret preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    if: github.head_ref == 'lab/azure-secret-preflight'
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - name: Check secret names only
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${AZURE_SPEECH_KEY:-}" ]; then missing+=("AZURE_SPEECH_KEY"); fi
          if [ -z "${AZURE_SPEECH_REGION:-}" ]; then missing+=("AZURE_SPEECH_REGION"); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf -v joined '%s, ' "${missing[@]}"
            echo "::error::Missing Azure Speech repository secret(s): ${joined%, }"
            exit 42
          fi
          echo "Azure Speech secrets are configured; values remain masked."
