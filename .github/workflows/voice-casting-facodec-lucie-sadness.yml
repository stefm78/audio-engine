name: Voice Casting FACodec Lucie Sadness Killer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/voice-casting-facodec-lucie-sadness.yml

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "32823632721"
  SOURCE_ARTIFACT: voice-casting-qwen3-contrast-emotion-killer-recovery
  AMPHION_REV: 26f6883110181f1dbfe95c70a7c7dbaf4de5f42a
  FACODEC_REPO: amphion/naturalspeech3_facodec
  FACODEC_REV: 314afc3ea1455ba881a0e484ef9408b6cb996736
  ECAPA_REV: eac27266f68caa806381260bd44ace38b136c76a
  WHISPER_REV: 5f86d1d86363843179951550570367b37c5d6f78
  WHISPER_MODEL: small
  WHISPER_MODEL_SHA256: 9ecf779972d90ba49c06d968637d720dd632c55bbf19d441fb42bf17a411e794
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  PIP_NO_CACHE_DIR: "1"

jobs:
  killer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Zero-cost protocol gate
        run: |
          python - <<'PY'
          # Exactly one conversion: the previously isolated kNN-VC weak case.
          source = "source/clips/claire--sadness-contained.wav"
          target = "source/reference-lucie.wav"
          outputs = ["evidence/clips/sadness-contained--lucie.wav"]
          assert "sadness-contained" in source
          assert target.endswith("reference-lucie.wav")
          assert len(outputs) == 1
          print("protocol: one FACodec conversion -> ECAPA -> Whisper Small; no parameter tuning")
          PY

      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true

      - name: Download immutable source evidence
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" -n "$SOURCE_ARTIFACT" -D source
          cat > source-hashes.txt <<'EOF'
          3366f993d108f42525627f1be03e71fdec312b559e067616d2019b69da35cafe  source/reference-claire.wav
          9e5ff59c1b2993b249851bfd3a9f8e78047fd5afd93b034392df1977ae54c822  source/reference-lucie.wav
          d2091868592c3c8691c2c0c6a39adaa3613d4941d087c36e4be69e5395a19c84  source/clips/claire--sadness-contained.wav
          EOF
          sha256sum -c source-hashes.txt

      - name: Install minimal FACodec runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            einops==0.8.0 \
            huggingface_hub==0.36.0 \
            soundfile==0.12.1 \
            scipy==1.14.1 \
            librosa==0.10.2.post1 \
            pyworld==0.3.5
          python -m pip check

      - name: Checkout pinned Amphion FACodec implementation
        run: |
          git init Amphion
          git -C Amphion remote add origin https://github.com/open-mmlab/Amphion.git
          git -C Amphion fetch --depth=1 origin "$AMPHION_REV"
          git -C Amphion checkout --detach FETCH_HEAD
          test "$(git -C Amphion rev-parse HEAD)" = "$AMPHION_REV"
          test -f Amphion/LICENSE
          grep -qi "MIT License" Amphion/LICENSE
          python -m py_compile \
            Amphion/models/codec/ns3_codec/facodec.py \
            Amphion/models/codec/ns3_codec/transformer.py \
            Amphion/models/codec/ns3_codec/quantize/fvq.py \
            Amphion/models/codec/ns3_codec/quantize/rvq.py

      - name: Download pinned FACodec checkpoints
        run: |
          mkdir -p facodec-weights evidence/clips
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          files = [
              "ns3_facodec_encoder.bin",
              "ns3_facodec_decoder.bin",
              "ns3_facodec_redecoder.bin",
          ]
          root = snapshot_download(
              repo_id=os.environ["FACODEC_REPO"],
              revision=os.environ["FACODEC_REV"],
              allow_patterns=files,
              local_dir="facodec-weights",
          )
          rows = {}
          for name in files:
              path = Path(root) / name
              if not path.is_file():
                  raise SystemExit(f"missing FACodec checkpoint: {path}")
              rows[name] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          report = {
              "repo": os.environ["FACODEC_REPO"],
              "revision": os.environ["FACODEC_REV"],
              "amphion_revision": os.environ["AMPHION_REV"],
              "files": rows,
          }
          Path("evidence/checkpoints.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, indent=2), flush=True)
          PY

      - name: Convert only Lucie contained sadness
        run: |
          python - <<'PY'
          import json
          import sys
          import time
          from pathlib import Path

          import soundfile as sf
          import torch
          import torchaudio

          sys.path.insert(0, str(Path(".").resolve()))
          from Amphion.models.codec.ns3_codec import (
              FACodecDecoder,
              FACodecEncoder,
              FACodecRedecoder,
          )

          torch.set_num_threads(2)
          torch.manual_seed(0)

          encoder = FACodecEncoder(
              ngf=32,
              up_ratios=[2, 4, 5, 5],
              out_channels=256,
          )
          decoder = FACodecDecoder(
              in_channels=256,
              upsample_initial_channel=1024,
              ngf=32,
              up_ratios=[5, 5, 4, 2],
              vq_num_q_c=2,
              vq_num_q_p=1,
              vq_num_q_r=3,
              vq_dim=256,
              codebook_dim=8,
              codebook_size_prosody=10,
              codebook_size_content=10,
              codebook_size_residual=10,
              use_gr_x_timbre=True,
              use_gr_residual_f0=True,
              use_gr_residual_phone=True,
          )
          redecoder = FACodecRedecoder()

          def load_state(module, path):
              state = torch.load(path, map_location="cpu", weights_only=True)
              module.load_state_dict(state, strict=True)
              module.eval()

          load_state(encoder, "facodec-weights/ns3_facodec_encoder.bin")
          load_state(decoder, "facodec-weights/ns3_facodec_decoder.bin")
          load_state(redecoder, "facodec-weights/ns3_facodec_redecoder.bin")

          def load16(path):
              wav, sr = torchaudio.load(path)
              wav = wav.mean(0, keepdim=True)
              if sr != 16000:
                  wav = torchaudio.functional.resample(wav, sr, 16000)
              return wav.unsqueeze(0)

          source = load16("source/clips/claire--sadness-contained.wav")
          target = load16("source/reference-lucie.wav")

          started = time.perf_counter()
          with torch.inference_mode():
              src_enc = encoder(source)
              tgt_enc = encoder(target)
              _, src_vq, _, _, _ = decoder(src_enc, eval_vq=False, vq=True)
              _, _, _, _, tgt_spk = decoder(tgt_enc, eval_vq=False, vq=True)
              converted_emb = redecoder.vq2emb(
                  src_vq, tgt_spk, use_residual=False
              )
              output = redecoder.inference(converted_emb, tgt_spk)
          elapsed = time.perf_counter() - started

          audio = output[0, 0].clamp(-1.0, 1.0).cpu().numpy()
          out_path = Path("evidence/clips/sadness-contained--lucie.wav")
          sf.write(out_path, audio, 16000, subtype="PCM_16")
          report = {
              "source": "claire--sadness-contained",
              "target_reference": "reference-lucie",
              "output": str(out_path),
              "sample_rate": 16000,
              "samples": int(audio.shape[0]),
              "inference_seconds_including_source_target_encode": round(elapsed, 6),
              "architecture": "FACodec source VQ (prosody+content; residual excluded) + target speaker embedding",
              "use_residual": False,
              "claim": "one-clip architectural killer only; no naturalness or acting qualification",
          }
          Path("evidence/conversion.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, indent=2), flush=True)
          PY

      - name: Record timing and prosody diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import librosa
          import numpy as np
          import pyworld as pw

          source_path = "source/clips/claire--sadness-contained.wav"
          output_path = "evidence/clips/sadness-contained--lucie.wav"

          def load(path):
              y, _ = librosa.load(path, sr=16000, mono=True)
              return y.astype(np.float64)

          def energy(y):
              frame, hop = 400, 160
              if len(y) < frame:
                  y = np.pad(y, (0, frame - len(y)))
              n = 1 + (len(y) - frame) // hop
              e = np.array([
                  np.sqrt(np.mean(y[i*hop:i*hop+frame] ** 2) + 1e-12)
                  for i in range(n)
              ])
              e = np.log(e + 1e-6)
              return (e - e.mean()) / (e.std() + 1e-8)

          def time_corr(a, b):
              n = max(len(a), len(b))
              grid = np.linspace(0.0, 1.0, n)
              aa = np.interp(grid, np.linspace(0.0, 1.0, len(a)), a)
              bb = np.interp(grid, np.linspace(0.0, 1.0, len(b)), b)
              return float(np.corrcoef(aa, bb)[0, 1])

          def norm_f0(y):
              f0, t = pw.dio(y, 16000, frame_period=10.0)
              f0 = pw.stonemask(y, f0, t, 16000)
              voiced = f0 > 0
              if int(voiced.sum()) < 5:
                  return None
              tt = t[voiced]
              vv = np.log(f0[voiced])
              if tt[-1] <= tt[0]:
                  return None
              tt = (tt - tt[0]) / (tt[-1] - tt[0])
              grid = np.linspace(0.0, 1.0, 100)
              vv = np.interp(grid, tt, vv)
              return (vv - vv.mean()) / (vv.std() + 1e-8)

          src = load(source_path)
          out = load(output_path)
          f0s, f0o = norm_f0(src), norm_f0(out)
          f0_corr = None
          if f0s is not None and f0o is not None:
              f0_corr = float(np.corrcoef(f0s, f0o)[0, 1])

          report = {
              "source_duration_seconds": round(len(src) / 16000.0, 6),
              "output_duration_seconds": round(len(out) / 16000.0, 6),
              "duration_ratio": round(len(out) / max(1, len(src)), 6),
              "energy_envelope_correlation": round(time_corr(energy(src), energy(out)), 6),
              "normalized_log_f0_contour_correlation": None if f0_corr is None else round(f0_corr, 6),
              "gate": False,
              "claim": "timing/energy/F0 diagnostics only; not automatic emotion or acting proof",
          }
          Path("evidence/prosody-diagnostics.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, indent=2), flush=True)
          PY

      - name: Install independent identity verifier
        run: |
          python -m pip install --disable-pip-version-check \
            speechbrain==1.0.3 \
            huggingface_hub==0.36.0
          python -m pip check
          mkdir -p verifier/ecapa
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          print(snapshot_download(
              repo_id="speechbrain/spkrec-ecapa-voxceleb",
              revision=os.environ["ECAPA_REV"],
              local_dir="verifier/ecapa",
          ))
          PY

      - name: Require identity to move to Lucie
        id: identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import torch
          import torchaudio
          from speechbrain.inference.speaker import EncoderClassifier

          torch.set_num_threads(2)
          model = EncoderClassifier.from_hparams(
              source=str(Path("verifier/ecapa").resolve()),
              savedir=str(Path("verifier/runtime").resolve()),
              run_opts={"device": "cpu"},
          )

          def emb(path):
              wav, sr = torchaudio.load(path)
              wav = wav.mean(0, keepdim=True)
              if sr != 16000:
                  wav = torchaudio.functional.resample(wav, sr, 16000)
              with torch.inference_mode():
                  e = model.encode_batch(wav).squeeze().cpu()
              return torch.nn.functional.normalize(e, dim=0)

          def sim(a, b):
              return float(torch.dot(a, b))

          claire = emb("source/reference-claire.wav")
          lucie = emb("source/reference-lucie.wav")
          source = emb("source/clips/claire--sadness-contained.wav")
          output = emb("evidence/clips/sadness-contained--lucie.wav")

          source_c, source_l = sim(source, claire), sim(source, lucie)
          output_c, output_l = sim(output, claire), sim(output, lucie)
          source_margin = source_l - source_c
          output_margin = output_l - output_c
          eligible = output_l > output_c and output_margin > source_margin

          report = {
              "source": {
                  "sim_claire": source_c,
                  "sim_lucie": source_l,
                  "lucie_margin": source_margin,
              },
              "output": {
                  "sim_claire": output_c,
                  "sim_lucie": output_l,
                  "lucie_margin": output_margin,
                  "ranks_lucie_first": output_l > output_c,
              },
              "identity_gate": {
                  "pass": eligible,
                  "rule": "output ranks Lucie above Claire AND Lucie-vs-Claire margin improves versus expressive source",
                  "absolute_threshold": False,
                  "claim": "ECAPA machine identity prefilter; not human identity proof",
              },
          }
          Path("evidence/identity.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, indent=2), flush=True)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:
              f.write(f"eligible={'true' if eligible else 'false'}\n")
          PY

      - name: Install pinned Whisper Small only after identity survives
        if: steps.identity.outputs.eligible == 'true'
        run: |
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/openai/whisper.git@$WHISPER_REV" \
            imageio-ffmpeg==0.6.0
          python -m pip check
          FFMPEG_BIN="$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$FFMPEG_BIN" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.local/bin:$PATH" ffmpeg -version | head -1

      - name: Require French content no worse than expressive source
        id: french
        if: steps.identity.outputs.eligible == 'true'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import unicodedata
          from pathlib import Path

          import whisper

          expected = "Il est parti avant l'aube. Je savais que ce moment viendrait, mais pas si tôt."

          def words(text):
              text = unicodedata.normalize("NFKD", text.lower())
              text = "".join(c for c in text if not unicodedata.combining(c))
              text = text.replace("'", " ").replace("’", " ").replace("-", " ")
              return re.findall(r"[a-z0-9]+", text)

          def edit_distance(a, b):
              prev = list(range(len(b) + 1))
              for i, x in enumerate(a, 1):
                  cur = [i]
                  for j, y in enumerate(b, 1):
                      cur.append(min(
                          cur[-1] + 1,
                          prev[j] + 1,
                          prev[j - 1] + (x != y),
                      ))
                  prev = cur
              return prev[-1]

          def wer(hyp, ref):
              r, h = words(ref), words(hyp)
              return edit_distance(r, h) / max(1, len(r))

          model = whisper.load_model(os.environ["WHISPER_MODEL"], device="cpu")
          model_path = Path.home() / ".cache" / "whisper" / f"{os.environ['WHISPER_MODEL']}.pt"
          model_sha = hashlib.sha256(model_path.read_bytes()).hexdigest()
          if model_sha != os.environ["WHISPER_MODEL_SHA256"]:
              raise SystemExit(f"Whisper model SHA mismatch: {model_sha}")

          def transcribe(path):
              result = model.transcribe(
                  path,
                  language="fr",
                  task="transcribe",
                  temperature=0.0,
                  fp16=False,
                  condition_on_previous_text=False,
                  verbose=False,
              )
              return result["text"].strip()

          source_text = transcribe("source/clips/claire--sadness-contained.wav")
          output_text = transcribe("evidence/clips/sadness-contained--lucie.wav")
          source_wer = wer(source_text, expected)
          output_wer = wer(output_text, expected)
          eligible = output_wer <= source_wer + 1e-12

          report = {
              "expected": expected,
              "source_text": source_text,
              "output_text": output_text,
              "source_wer": round(source_wer, 6),
              "output_wer": round(output_wer, 6),
              "whisper": {
                  "revision": os.environ["WHISPER_REV"],
                  "model": os.environ["WHISPER_MODEL"],
                  "model_sha256": model_sha,
                  "language": "fr",
              },
              "content_gate": {
                  "pass": eligible,
                  "rule": "FACodec converted WER(expected) <= expressive-source WER(expected)",
                  "absolute_threshold": False,
                  "claim": "ASR intelligibility/content preservation only; not naturalness or acting proof",
              },
          }
          Path("evidence/french.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2), flush=True)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:
              f.write(f"eligible={'true' if eligible else 'false'}\n")
          PY

      - name: Record machine smoke PASS
        if: steps.identity.outputs.eligible == 'true' && steps.french.outputs.eligible == 'true'
        run: |
          cat > evidence/final.json <<'EOF'
          {
            "status": "machine-smoke-pass",
            "scope": "one Lucie contained-sadness clip only",
            "next": "eligible for bounded four-clip FACodec matrix",
            "human_proof": false,
            "production_qualified": false
          }
          EOF

      - name: Record identity rejection
        if: steps.identity.outputs.eligible != 'true'
        run: |
          cat > evidence/final.json <<'EOF'
          {
            "status": "machine-reject",
            "reason": "FACodec output failed target-identity movement gate",
            "next": "do not expand FACodec matrix",
            "human_proof": false,
            "production_qualified": false
          }
          EOF

      - name: Record French/content rejection
        if: steps.identity.outputs.eligible == 'true' && steps.french.outputs.eligible != 'true'
        run: |
          cat > evidence/final.json <<'EOF'
          {
            "status": "machine-reject",
            "reason": "FACodec output degraded French/content versus expressive source",
            "next": "do not expand FACodec matrix",
            "human_proof": false,
            "production_qualified": false
          }
          EOF

      - name: Upload bounded FACodec machine evidence
        uses: actions/upload-artifact@v4
        with:
          name: facodec-lucie-sadness-killer
          path: evidence/
          if-no-files-found: error
          retention-days: 14
