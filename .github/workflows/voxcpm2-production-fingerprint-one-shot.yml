name: VoxCPM2 Production fingerprint one-shot

on:
  push:
    branches:
      - prod/voxcpm2-provider-v1
    paths:
      - .github/workflows/voxcpm2-production-fingerprint-one-shot.yml

permissions:
  contents: read

env:
  VOXCPM_REV: ee8161e9e1b7b082cb5721a3a9980da4204401e6
  MODEL_ID: openbmb/VoxCPM2
  MODEL_REV: 32279effe8c19989596f05d353d1447f51d9e915

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.16'

      - name: Install exact accepted runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          git clone --filter=blob:none https://github.com/OpenBMB/VoxCPM.git /tmp/voxcpm-upstream
          git -C /tmp/voxcpm-upstream checkout "$VOXCPM_REV"
          test "$(git -C /tmp/voxcpm-upstream rev-parse HEAD)" = "$VOXCPM_REV"
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             torch==2.7.1 torchaudio==2.7.1
          python -m pip install --disable-pip-version-check             pydub==0.25.1 soundfile==0.12.1
          python -m pip install --disable-pip-version-check -e /tmp/voxcpm-upstream
          python -m pip check
          echo '---PIP_FREEZE_BEGIN---'
          python -m pip freeze --all | LC_ALL=C sort
          echo '---PIP_FREEZE_END---'
          echo '---SYSTEM_RUNTIME---'
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          dpkg-query -W -f='ffmpeg-package=${Version}\n' ffmpeg

      - name: Fingerprint exact model snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              revision=os.environ["MODEL_REV"],
              local_dir="/tmp/voxcpm2-model",
          )
          PY
          echo '---MODEL_FILES_BEGIN---'
          find /tmp/voxcpm2-model -type f ! -path '*/.cache/*' -print0             | sort -z             | xargs -0 sha256sum
          echo '---MODEL_FILES_END---'
          du -sh /tmp/voxcpm2-model
