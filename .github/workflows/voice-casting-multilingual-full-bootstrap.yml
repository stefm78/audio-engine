name: Voice Casting Multilingual Full Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/voice-casting-multilingual-full-bootstrap.yml

permissions:
  contents: read
  issues: write

jobs:
  campaign:
    strategy:
      fail-fast: false
      matrix:
        stage:
          - expressive
          - age
          - long-form
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Render expanded campaign
        run: |
          set -euo pipefail
          audio-engine voice-lab render \
            --scope provider \
            --candidate-set fr-plus-multilingual \
            --stage "${{ matrix.stage }}" \
            --out "voice-lab-${{ matrix.stage }}" \
            | tee "voice-lab-${{ matrix.stage }}-result.json"

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-casting-fr-plus-multilingual-${{ matrix.stage }}
          path: |
            voice-lab-${{ matrix.stage }}/
            voice-lab-${{ matrix.stage }}-result.json
          if-no-files-found: warn
          retention-days: 14

  report:
    if: always()
    needs:
      - campaign
    runs-on: ubuntu-latest
    steps:
      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.campaign.result }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Voice casting multilingual full campaign $RUN_ID" \
            --body "One-shot expanded French + Multilingual expressive, age and long-form campaigns completed.\n\n- run_id: $RUN_ID\n- matrix_result: $RESULT\n- run: $RUN_URL\n- artifacts: voice-casting-fr-plus-multilingual-{expressive,age,long-form}\n\nThis issue is a machine locator and may be closed after evidence retrieval."
